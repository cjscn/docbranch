  /* ====== 一键提交入口 ====== */
  async pushAll() {
    // 1. 检查配置
    const cfg = GHConfig.get();
    if (!cfg || !cfg.token || !cfg.repo) {
      // R1: 首次使用 → 弹设置窗，关闭后不继续
      this.openSettings();
      return;
    }

    // 2. 先保存当前文件，确保数据最新
    Storage.saveCurrent();

    // 3. 构造 commit message 弹窗（可编辑）
    const numFiles = state.files.length;
    const defaultMsg = this._buildCommitMsg(numFiles);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal modal-lg">
        <h3>☁️ 一键提交到 GitHub</h3>
        <p style="font-size:13px;color:#57606a;margin-bottom:10px;">
          仓库: <strong>${cfg.repo}</strong> · 分支: <strong>${cfg.branch}</strong> ·
          共 <strong>${numFiles}</strong> 个文件
        </p>
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">Commit Message</label>
        <input type="text" id="gh-commit-msg" style="width:100%;padding:7px 10px;border:1px solid #d0d7de;border-radius:5px;font-size:13px;margin-bottom:14px;" value="${defaultMsg}" />
        <div id="gh-progress-area" class="gh-progress" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="gh-push-cancel">取消</button>
          <button class="btn-primary" id="gh-push-do">🚀 开始提交</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();

    overlay.querySelector('#gh-push-cancel').onclick = close;

    overlay.querySelector('#gh-push-do').onclick = async () => {
      const msg = overlay.querySelector('#gh-commit-msg').value.trim() || defaultMsg;
      overlay.querySelector('#gh-push-do').disabled = true;
      overlay.querySelector('#gh-push-cancel').disabled = true;
      const progressArea = overlay.querySelector('#gh-progress-area');
      progressArea.style.display = 'block';

      const { owner, repo, branch, token } = this._parseCfg(cfg);

      // 每个文件对应两个 PUT（docPath + annotations），共 N*2 + 1 (index) 次
      const plan = this._buildPushPlan();
      const results = []; // { target, ok, sha, error }
      const conflicts = []; // 409 冲突的文件

      // 渲染初始进度
      progressArea.innerHTML = plan.map(p =>
        `<div class="file-line status-wait" data-target="${p.target}">
          <span class="status-icon">⏳</span>
          <span>${p.target}</span>
        </div>`
      ).join('');

      const updateLine = (target, status, icon, extra = '') => {
        const line = progressArea.querySelector(`[data-target="${target}"]`);
        if (!line) return;
        line.className = `file-line ${status}`;
        line.querySelector('.status-icon').textContent = icon;
        if (extra) line.innerHTML += `<span style="margin-left:auto;font-size:11px;">${extra}</span>`;
      };

      // 逐个文件提交
      for (const item of plan) {
        try {
          updateLine(item.target, 'status-wait', '⏳');
          // GET 远端 SHA（用于 PUT），404 表示新文件不需要 sha
          let sha = null;
          try {
            const remote = await GitHubAPI.getContents(owner, repo, item.target, branch, token);
            if (remote && remote.sha) sha = remote.sha;
          } catch {}

          try {
            const res = await GitHubAPI.putContents(owner, repo, item.target, item.content, msg, branch, sha, token);
            updateLine(item.target, 'status-ok', '✅', `→ ${res.commit?.sha?.substring(0,7) || ''}`);
            results.push({ target: item.target, ok: true, sha: res.commit?.sha });
          } catch (err) {
            if (err.status === 409) {
              updateLine(item.target, 'status-fail', '⚠️', 'SHA 冲突');
              conflicts.push(item);
              results.push({ target: item.target, ok: false, error: 'conflict', item });
            } else {
              updateLine(item.target, 'status-fail', '❌', err.message);
              results.push({ target: item.target, ok: false, error: err.message });
            }
          }
        } catch (err) {
          updateLine(item.target, 'status-fail', '❌', err.message);
          results.push({ target: item.target, ok: false, error: err.message });
        }
      }

      // 处理冲突
      if (conflicts.length > 0) {
        await this._handleConflicts(conflicts, cfg, msg, progressArea, updateLine, results);
      }

      // 汇总
      const successCount = results.filter(r => r.ok).length;
      const failCount = results.filter(r => !r.ok).length;
      const finalMsg = document.createElement('div');
      finalMsg.className = 'commit-link';

      // 找到最后一个成功的 commit SHA
      const lastSha = results.filter(r => r.sha).pop()?.sha;
      if (lastSha) {
        finalMsg.innerHTML = `<strong>✅ 提交完成：</strong> ${successCount}/${results.length} 个文件成功 · 
          <a href="https://github.com/${cfg.repo}/commit/${lastSha}" target="_blank">查看 commit →</a>`;
      } else if (failCount > 0) {
        finalMsg.innerHTML = `<strong>❌ 提交失败：</strong> ${failCount} 个文件未成功。请检查错误后重试。`;
      }
      progressArea.appendChild(finalMsg);

      overlay.querySelector('#gh-push-do').textContent = '已完成';
      overlay.querySelector('#gh-push-do').disabled = true;
      overlay.querySelector('#gh-push-cancel').disabled = false;
      overlay.querySelector('#gh-push-cancel').textContent = '关闭';

      UI.setSaveStatus(`GitHub Sync: ${successCount}/${results.length}`);
    };
  },

  /* 解析配置为 owner/repo */
  _parseCfg(cfg) {
    const [owner, repo] = cfg.repo.split('/');
    return { owner, repo, branch: cfg.branch || 'main', token: cfg.token };
  },

  /* 构建提交计划 —— 所有文件的 doc + annotations + index */
  _buildPushPlan() {
    const plan = [];

    // 先保存当前文件一次，保证 localStorage 最新
    Storage.saveCurrent();

    for (const f of state.files) {
      const data = Storage.loadFile(f.id);
      if (!data) continue;

      // 1. docPath → Monaco 内容
      const docContent = (f.id === state.currentFileId && state.monaco)
        ? state.monaco.getValue()
        : data.docContent || '';
      plan.push({ target: f.docPath, content: docContent });

      // 2. annotations/{name}.annotations.json → 批注 JSON
      const annFile = {
        version: DATA_VERSION,
        fileId: f.id,
        fileName: f.name,
        docPath: f.docPath,
        annotations: data.annotations || [],
        collapsedIds: data.collapsedIds || [],
      };
      plan.push({ target: this._annotationPath(f.docPath), content: JSON.stringify(annFile, null, 2) });
    }

    // 3. docbranch-index.json —— 索引文件
    const indexFile = {
      version: DATA_VERSION,
      files: state.files.map(f => ({ id: f.id, name: f.name, docPath: f.docPath })),
      updatedAt: new Date().toISOString(),
    };
    plan.push({ target: 'docbranch-index.json', content: JSON.stringify(indexFile, null, 2) });

    return plan;
  },

  /* ====== 冲突处理弹窗（R7） ======
     注意：GitHub Contents API 不允许不带 SHA 覆盖已有文件，
     所以 force 和 pull_first 在技术上都需要先 GET 最新 SHA 再 PUT。
     两者区别仅在 UI 提示的语义上。
  */
  async _handleConflicts(conflicts, cfg, msg, progressArea, updateLine, results) {
    return new Promise((resolve) => {
      const { owner, repo, branch, token } = this._parseCfg(cfg);

      const subOverlay = document.createElement('div');
      subOverlay.className = 'modal-overlay';
      subOverlay.innerHTML = `
        <div class="modal modal-lg gh-conflict">
          <h3>⚠️ 远端有更新 —— SHA 冲突</h3>
          <p style="color:#57606a;">以下文件在远端已被他人修改，如何处理？</p>
          <div class="conflict-file-list">
            ${conflicts.map(c => c.target).join('<br>')}
          </div>
          <div class="radio-group">
            <label><input type="radio" name="gh-conflict-mode" value="force" checked> <strong>强制覆盖</strong>：用本地版本覆盖远端，丢弃他人改动</label>
            <label><input type="radio" name="gh-conflict-mode" value="pull_first"> <strong>先取最新 SHA 再覆盖</strong>：先 GET 远端最新提交确认状态，再 PUT 本地版本</label>
            <label><input type="radio" name="gh-conflict-mode" value="cancel"> 取消本次提交</label>
          </div>
          <p style="font-size:11px;color:#bf8700;margin-top:8px;">
            💡 注：GitHub API 要求覆盖已有文件必须传最新 SHA，以上两种方式实现相同，仅语义不同。
          </p>
          <div class="modal-actions">
            <button class="btn-secondary" id="gh-conf-close">取消</button>
            <button class="btn-primary" id="gh-conf-do">继续</button>
          </div>
        </div>
      `;
      document.body.appendChild(subOverlay);

      const close = () => subOverlay.remove();
      subOverlay.querySelector('#gh-conf-close').onclick = () => { close(); resolve(); };

      subOverlay.querySelector('#gh-conf-do').onclick = async () => {
        const mode = subOverlay.querySelector('input[name="gh-conflict-mode"]:checked').value;
        close();

        if (mode === 'cancel') { resolve(); return; }

        // force / pull_first 在技术上相同：都必须先 GET SHA 再 PUT
        for (const item of conflicts) {
          try {
            updateLine(item.target, 'status-wait', '⏳ (重试)');
            let sha = null;
            try {
              const remote = await GitHubAPI.getContents(owner, repo, item.target, branch, token);
              if (remote && remote.sha) sha = remote.sha;
            } catch {}

            const res = await GitHubAPI.putContents(owner, repo, item.target, item.content, msg, branch, sha, token);
            updateLine(item.target, 'status-ok', '✅', `→ ${res.commit?.sha?.substring(0,7) || ''}`);
            const r = results.find(r => r.target === item.target);
            if (r) { r.ok = true; r.sha = res.commit?.sha; r.error = null; }
          } catch (err) {
            updateLine(item.target, 'status-fail', '❌', err.message);
            const r = results.find(r => r.target === item.target);
            if (r) { r.ok = false; r.error = err.message; }
          }
        }
        resolve();
      };
    });
  },

  /* ====== 从远端拉取（R9） ====== */
  async pullFromRemote() {
    const cfg = GHConfig.get();
    if (!cfg || !cfg.token || !cfg.repo) {
      this.openSettings();
      return;
    }

    const { owner, repo, branch, token } = this._parseCfg(cfg);

    // R9: 弹窗选择合并策略
    const askMode = () => new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal modal-lg">
          <h3>📥 从 GitHub 拉取</h3>
          <p style="font-size:13px;color:#57606a;margin-bottom:14px;">
            仓库: <strong>${cfg.repo}</strong> · 分支: <strong>${cfg.branch}</strong>
          </p>
          <div class="radio-group">
            <label><input type="radio" name="gh-pull-mode" value="merge" checked> <strong>合并模式</strong>：本地已有文件保留，远端新文件新增（推荐）</label>
            <label><input type="radio" name="gh-pull-mode" value="replace"> <strong>完全覆盖</strong>：用远端内容替换本地全部文件和批注（本地未提交的改动会丢失）</label>
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" id="gh-pull-cancel">取消</button>
            <button class="btn-primary" id="gh-pull-do">🚀 开始拉取</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector('#gh-pull-cancel').onclick = () => { close(); resolve(null); };
      overlay.querySelector('#gh-pull-do').onclick = () => {
        const mode = overlay.querySelector('input[name="gh-pull-mode"]:checked').value;
        close(); resolve(mode);
      };
    });

    const mode = await askMode();
    if (!mode) return; // 用户取消

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal modal-lg">
        <h3>📥 从 GitHub 拉取 —— 进行中</h3>
        <div id="gh-pull-progress" class="gh-progress"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="gh-pull-close" disabled>关闭</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const prog = overlay.querySelector('#gh-pull-progress');
    prog.innerHTML = `<div class="file-line status-wait"><span class="status-icon">⏳</span><span>获取文件索引 docbranch-index.json</span></div>`;

    // 1. GET docbranch-index.json
    let indexData;
    try {
      const idx = await GitHubAPI.getContents(owner, repo, 'docbranch-index.json', branch, token);
      if (!idx) {
        prog.innerHTML = `<div class="file-line status-fail"><span class="status-icon">❌</span><span>仓库根目录无 docbranch-index.json，无法识别文件列表</span></div>`;
        overlay.querySelector('#gh-pull-close').disabled = false;
        return;
      }
      indexData = JSON.parse(idx._decoded);
      prog.innerHTML = `<div class="file-line status-ok"><span class="status-icon">✅</span><span>获取索引成功（${indexData.files?.length || 0} 个文件）</span></div>`;
    } catch (err) {
      prog.innerHTML += `<div class="file-line status-fail"><span class="status-icon">❌</span><span>拉取索引失败: ${err.message}</span></div>`;
      overlay.querySelector('#gh-pull-close').disabled = false;
      return;
    }

    // 2. 逐个拉取文件
    const remoteFiles = indexData.files || [];
    const mergePlans = [];

    for (const f of remoteFiles) {
      prog.innerHTML += `<div class="file-line status-wait"><span class="status-icon">⏳</span><span>${f.docPath} + annotations</span></div>`;
      try {
        const [docRes, annRes] = await Promise.all([
          GitHubAPI.getContents(owner, repo, f.docPath, branch, token),
          GitHubAPI.getContents(owner, repo, `annotations/${f.docPath.split('/').pop()}.annotations.json`, branch, token),
        ]);
        // 清掉这个 wait 行
        const waits = prog.querySelectorAll('.file-line.status-wait');
        waits.forEach(el => el.remove());

        const docContent = docRes?._decoded || '';
        let annotationsData = { annotations: [], collapsedIds: [] };
        if (annRes?._decoded) {
          try { annotationsData = JSON.parse(annRes._decoded); } catch {}
        }

        // 查找本地是否已有此文件（按 id 或 docPath 匹配）
        const localFile = state.files.find(lf =>
          (f.id && lf.id === f.id) || lf.docPath === f.docPath
        );

        mergePlans.push({ file: f, docContent, annotationsData, localFile });
        prog.innerHTML += `<div class="file-line status-ok"><span class="status-icon">✅</span><span>${f.docPath}</span></div>`;
      } catch (err) {
        prog.innerHTML += `<div class="file-line status-fail"><span class="status-icon">❌</span><span>${f.docPath}: ${err.message}</span></div>`;
      }
    }

    // 3. 应用合并/覆盖 —— 先在内存中构建新状态，成功后再一次性写入 localStorage
    //    避免中途失败导致数据丢失
    const newLocalFiles = []; // replace 模式下全新的文件列表

    for (const plan of mergePlans) {
      if (plan.localFile && mode === 'merge') {
        // 合并模式：只覆盖已有文件的内容
        const fileKey = Storage._fileKey(plan.localFile.id);
        localStorage.setItem(fileKey, JSON.stringify({
          version: DATA_VERSION,
          docContent: plan.docContent,
          annotations: plan.annotationsData.annotations || [],
          collapsedIds: plan.annotationsData.collapsedIds || [],
        }));
        if (plan.localFile.id === state.currentFileId) {
          Storage.switchToFile(plan.localFile.id);
        }
      } else {
        // 新建文件（来自远端，或 replace 模式全部重建）
        const id = plan.file.id || uuidv4();
        const newFile = {
          id,
          name: plan.file.name || plan.docPath.split('/').pop() || '远端文件',
          docPath: plan.file.docPath,
        };
        // replace 模式下先收集到 newLocalFiles，稍后统一写入
        // merge 模式下直接追加到 state.files
        if (mode === 'merge') {
          state.files.push(newFile);
          localStorage.setItem(Storage._fileKey(id), JSON.stringify({
            version: DATA_VERSION,
            docContent: plan.docContent,
            annotations: plan.annotationsData.annotations || [],
            collapsedIds: plan.annotationsData.collapsedIds || [],
          }));
        } else {
          newLocalFiles.push({
            file: newFile,
            data: JSON.stringify({
              version: DATA_VERSION,
              docContent: plan.docContent,
              annotations: plan.annotationsData.annotations || [],
              collapsedIds: plan.annotationsData.collapsedIds || [],
            }),
          });
        }
      }
    }

    // replace 模式：先备份、再写入新数据、最后删除旧数据
    if (mode === 'replace') {
      // 1) 备份所有旧文件 key（方便出问题时恢复）
      const backup = [];
      for (const oldF of state.files) {
        const k = Storage._fileKey(oldF.id);
        const v = localStorage.getItem(k);
        if (v) backup.push({ key: k, value: v });
      }
      localStorage.setItem('doc-branch-backup-v1', JSON.stringify(backup));

      try {
        // 2) 先把新文件数据全部写入 localStorage
        for (const nf of newLocalFiles) {
          localStorage.setItem(Storage._fileKey(nf.file.id), nf.data);
        }
        // 3) 再删除旧文件数据
        for (const oldF of state.files) {
          localStorage.removeItem(Storage._fileKey(oldF.id));
        }
        // 4) 更新内存状态
        state.files = newLocalFiles.map(nf => nf.file);
        if (state.files.length > 0) {
          state.currentFileId = state.files[0].id;
          // 加载第一个文件到 Monaco
          const firstData = Storage.loadFile(state.currentFileId);
          state.monaco.setValue(firstData?.docContent || '');
          state.annotations = firstData?.annotations || [];
          state.collapsedIds = new Set(firstData?.collapsedIds || []);
          Annotations.refreshTopLevelStatus();
          Highlight.refreshAll();
          RightPanel.render();
        } else {
          state.currentFileId = null;
        }
        // 5) 成功后清除备份
        localStorage.removeItem('doc-branch-backup-v1');
      } catch (err) {
        // 6) 失败：恢复备份
        for (const item of backup) {
          localStorage.setItem(item.key, item.value);
        }
        state.files.forEach(oldF => {
          // 重新加载 state.files 不变
        });
        prog.innerHTML += `<div class="file-line status-fail" style="margin-top:10px;"><span class="status-icon">❌</span><span>写入失败，已恢复备份：${err.message}</span></div>`;
        overlay.querySelector('#gh-pull-close').disabled = false;
        return;
      }
    }

    Storage.saveIndex();
    Files.updateSwitcher();

    prog.innerHTML += `<div class="file-line status-ok" style="margin-top:10px;"><span class="status-icon">🎉</span><span>拉取完成！（${mode === 'merge' ? '合并' : '覆盖'}模式）</span></div>`;
    overlay.querySelector('#gh-pull-close').disabled = false;
    overlay.querySelector('#gh-pull-close').onclick = () => overlay.remove();

    UI.setSaveStatus(`GitHub Pull 完成 · ${state.files.length} 个文件`);
  },
};

/* GitHub 按钮事件绑定 */
document.getElementById('btn-gh-settings').onclick = () => GitHubSync.openSettings();
document.getElementById('btn-gh-push').onclick = () => GitHubSync.pushAll();
document.getElementById('btn-gh-pull').onclick = () => GitHubSync.pullFromRemote();

/* ==================== Layer 6.4: 目录树侧边栏 ==================== */
const DT_KEY_COLLAPSED = 'doc-branch-folder-collapsed-v1';
const DT_KEY_SIDEBAR = 'doc-branch-sidebar-open-v1';

const DirectoryTree = {
  /* 从 localStorage 读折叠目录前缀数组 */
  _getCollapsed() {
    try {
      const raw = localStorage.getItem(DT_KEY_COLLAPSED);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  },
  _saveCollapsed(arr) { localStorage.setItem(DT_KEY_COLLAPSED, JSON.stringify(arr)); },

  /* 从 docPath 推导目录树 Map
     输入：[{id, name, docPath}, ...]
     输出：{
       folders: { 'docs/': { files:[{file}], folders:{ 'docs/archive/': {...} } },
       files: [{file}]  // 根目录文件
     }
     其中每个 node 结构：{ files:[], sub:{ 子前缀: node } }
     注意：前缀约定 'docs/' 含尾部斜杠，根目录用 '' 空字符串作前缀
  */
  _buildTree(files) {
    const root = { files: [], sub: {} };
    for (const f of files) {
      // 按 / 分割，取目录部分 + 文件名
      const parts = f.docPath.split('/');
      const fileName = parts.pop(); // 最后一段
      let cur = root;
      let prefix = '';
      for (const p of parts) {
        prefix += p + '/';
        if (!cur.sub[prefix]) cur.sub[prefix] = { files: [], sub: {}, prefix };
        cur = cur.sub[prefix];
      }
      cur.files.push({ ...f, _fileName: fileName });
    }
    return root;
  },

  /* 渲染整个目录树到 #directory-tree */
  render() {
    const container = document.getElementById('directory-tree');
    const collapsed = this._getCollapsed();
    const tree = this._buildTree(state.files);

    // 构建 DOM
    const frag = document.createDocumentFragment();

    // 先渲染根目录文件
    for (const f of tree.files) {
      frag.appendChild(this._renderFileNode(f, true));
    }

    // 再按层级渲染目录
    // 按前缀长度排序，短的先渲染（浅目录先于深目录）
    const allFolders = Object.values(tree.sub);
    allFolders.sort((a, b) => a.prefix.length - b.prefix.length);

    // 根层级目录：前缀只含一个 / 或无前缀斜杠的
    const rootLevel = allFolders.filter(f => (f.prefix.match(/\//g) || []).length === 1);
    const rendered = new Set();

    const renderFolder = (node, depth) => {
      if (rendered.has(node.prefix)) return;
      rendered.add(node.prefix);

      const el = this._renderFolderNode(node, depth, collapsed);
      frag.appendChild(el);

      // 渲染子目录
      const subs = Object.values(node.sub);
      subs.sort((a, b) => a.prefix.length - b.prefix.length);
      for (const sub of subs) {
        renderFolder(sub, depth + 1);
      }
    };

    for (const f of rootLevel) renderFolder(f, 0);

    // 其他孤立目录（根层级没覆盖的，兜底渲染）
    for (const f of allFolders) {
      if (!rendered.has(f.prefix)) renderFolder(f, 0);
    }

    container.innerHTML = '';
    container.appendChild(frag);

    // 绑定点击事件（使用事件委托 —— 在 container 上统一监听）
    this._bindEvents();
  },

  /* 渲染一个目录节点 */
  _renderFolderNode(node, depth, collapsed) {
    const isCollapsed = collapsed.includes(node.prefix);
    const el = document.createElement('div');
    el.className = 'tree-folder';
    el.dataset.prefix = node.prefix;

    const header = document.createElement('div');
    header.className = 'tree-folder-header';
    header.dataset.prefix = node.prefix;

    const icon = document.createElement('span');
    icon.className = 'folder-icon';
    icon.textContent = isCollapsed ? '▶' : '▼';

    const name = document.createElement('span');
    name.className = 'folder-name';
    // 显示目录名（最后一段 + 斜杠）
    const parts = node.prefix.split('/').filter(Boolean);
    name.textContent = (parts.pop() || node.prefix) + '/';

    const count = document.createElement('span');
    count.className = 'folder-count';
    const totalFiles = this._countAllFiles(node);
    count.textContent = totalFiles;

    header.appendChild(icon);
    header.appendChild(name);
    if (totalFiles > 0) header.appendChild(count);
    el.appendChild(header);

    if (!isCollapsed) {
      const children = document.createElement('div');
      children.className = 'tree-folder-children';

      // 文件
      for (const f of node.files) {
        children.appendChild(this._renderFileNode(f, false));
      }

      // 子目录
      const subs = Object.values(node.sub);
      subs.sort((a, b) => a.prefix.length - b.prefix.length);
      for (const sub of subs) {
        children.appendChild(this._renderFolderNode(sub, depth + 1, collapsed));
      }

      el.appendChild(children);
    }

    return el;
  },

  /* 递归统计目录下所有文件数 */
  _countAllFiles(node) {
    let c = node.files.length;
    for (const sub of Object.values(node.sub)) c += this._countAllFiles(sub);
    return c;
  },

  /* 渲染一个文件节点 */
  _renderFileNode(file, isRootLevel) {
    const el = document.createElement('div');
    el.className = 'tree-file' + (isRootLevel ? ' tree-root-file' : '') +
      (file.id === state.currentFileId ? ' file-active' : '');
    el.dataset.id = file.id;
    el.title = file.docPath;

    const icon = document.createElement('span');
    icon.className = 'file-icon';
    // 根据 docPath 后缀给不同 emoji
    const ext = file.docPath.split('.').pop().toLowerCase();
    const iconMap = { md: '📝', markdown: '📝', txt: '📄', json: '📋', js: '📜', ts: '📜', py: '🐍' };
    icon.textContent = iconMap[ext] || '📄';

    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = file.name || file._fileName;

    const pathBadge = document.createElement('span');
    pathBadge.className = 'file-path';
    pathBadge.textContent = file._fileName;

    el.appendChild(icon);
    el.appendChild(name);
    if (file.id !== state.currentFileId) el.appendChild(pathBadge);

    return el;
  },

  /* 事件委托：在 directory-tree container 上统一监听 click */
  _bindEvents() {
    const container = document.getElementById('directory-tree');
    // 用 once 的方式？不，目录树每次 render 都重建 DOM，所以每次 render 后重新绑
    container.onclick = (e) => {
      // 点击目录 header
      const folderHeader = e.target.closest('.tree-folder-header');
      if (folderHeader) {
        const prefix = folderHeader.dataset.prefix;
        this._toggleFolder(prefix);
        return;
      }
      // 点击文件
      const fileNode = e.target.closest('.tree-file');
      if (fileNode) {
        const id = fileNode.dataset.id;
        if (id && id !== state.currentFileId) {
          Storage.switchToFile(id);
          this.render(); // 重新渲染（currentFileId 变了，高亮要更新）
        }
        return;
      }
    };
  },

  /* 切换某个目录的折叠状态 */
  _toggleFolder(prefix) {
    const collapsed = this._getCollapsed();
    const idx = collapsed.indexOf(prefix);
    if (idx >= 0) collapsed.splice(idx, 1);
    else collapsed.push(prefix);
    this._saveCollapsed(collapsed);
    this.render();
  },

  /* ========== 抽屉显隐 ========== */
  initSidebar() {
    const saved = localStorage.getItem(DT_KEY_SIDEBAR);
    const open = saved === null ? false : saved === 'true'; // 默认隐藏
    if (open) this.open();
    else this.close();
    this.render();
  },

  toggle() {
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('sidebar-hidden')) this.open();
    else this.close();
  },

  open() {
    const sb = document.getElementById('sidebar');
    sb.classList.remove('sidebar-hidden');
    document.getElementById('btn-toggle-sidebar').classList.add('active');
    localStorage.setItem(DT_KEY_SIDEBAR, 'true');
  },

  close() {
    const sb = document.getElementById('sidebar');
    sb.classList.add('sidebar-hidden');
    document.getElementById('btn-toggle-sidebar').classList.remove('active');
    localStorage.setItem(DT_KEY_SIDEBAR, 'false');
  },
};

/* 目录树按钮绑定 */
document.getElementById('btn-toggle-sidebar').onclick = () => DirectoryTree.toggle();

/* ==================== Layer 7: 启动 ==================== */
if (window.matchMedia('(max-width: 768px)').matches) {
  // 移动端：跳过 Monaco，用阅读模式
  MobileReader.init();
} else {
  // 桌面端：原有流程
  Editor.init();
  DirectoryTree.initSidebar();
  Guideline.init();
}

/* ==================== Layer 8: 拖拽分割线 ==================== */
const Splitter = {
  RATIO_MIN: 30,
  RATIO_MAX: 80,
  RATIO_DEFAULT: 60,

  init() {
    const el = document.getElementById('splitter');
    if (!el) return;
    // 启动恢复上次位置
    this._apply(this._load());

    // 拖拽：mousedown 注册全局 mousemove/mouseup
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();   // R8: 防止文字选中
      e.stopPropagation();  // 不影响子元素事件
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      const onMove = (ev) => {
        ev.preventDefault();
        this._apply(this._calcRatio(ev.clientX));
      };
      const onUp = () => {
        // R9: 松开鼠标时清理监听器
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        this._save(state.splitRatio);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    // R5: 双击恢复默认 60:40
    el.addEventListener('dblclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
      this._apply(this.RATIO_DEFAULT);
      this._save(this.RATIO_DEFAULT);
    });
  },

  // 根据鼠标 X 计算左栏百分比（排除 sidebar 宽度与 splitter 宽度）
  _calcRatio(clientX) {
    const main = document.getElementById('main');
    const rect = main.getBoundingClientRect();
    const sidebar = document.getElementById('sidebar');
    const sbHidden = !sidebar || sidebar.classList.contains('sidebar-hidden');
    const sbWidth = sbHidden ? 0 : sidebar.getBoundingClientRect().width;
    const usable = rect.width - sbWidth - 6; // 6 = splitter 宽度
    if (usable <= 0) return this.RATIO_DEFAULT;
    const rel = clientX - rect.left - sbWidth;
    let r = (rel / usable) * 100;
    if (r < this.RATIO_MIN) r = this.RATIO_MIN;
    if (r > this.RATIO_MAX) r = this.RATIO_MAX;
    return r;
  },

  _apply(ratio) {
    state.splitRatio = ratio;
    document.getElementById('main').style.setProperty('--left-ratio', ratio);
  },

  _load() {
    try {
      const v = parseFloat(localStorage.getItem(SPLIT_RATIO_KEY));
      if (isNaN(v)) return this.RATIO_DEFAULT;
      return Math.max(this.RATIO_MIN, Math.min(this.RATIO_MAX, v));
    } catch (e) { return this.RATIO_DEFAULT; }
  },

  _save(ratio) {
    try { localStorage.setItem(SPLIT_RATIO_KEY, String(ratio)); } catch (e) {}
  },
};
Splitter.init();
