      `<option value="${t.key}" ${t.key === defaultTag ? 'selected' : ''}>${t.label}</option>`
    ).join('');
    return `
      <div class="modal-row" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <label style="font-size:12px;color:#57606a;flex-shrink:0;">标签：</label>
        <select id="modal-tag" style="flex:1;background:#fff;border:1px solid #d0d7de;color:#24292f;padding:5px 8px;border-radius:4px;font-size:12px;outline:none;cursor:pointer;">
          <option value="">（无标签）</option>
          ${options}
        </select>
      </div>
    `;
  },

  showAddTopLevel(range, sourceText) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>📝 添加批注</h3>
        <div class="selected-preview">${UI.escapeHtml(sourceText)}</div>
        ${this._tagSelectHtml()}
        <textarea id="modal-note" placeholder="输入批注说明，支持 Markdown 语法..."></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">取消</button>
          <button class="btn-primary" id="modal-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const noteInput = overlay.querySelector('#modal-note');
    const tagSelect = overlay.querySelector('#modal-tag');
    noteInput.focus();

    const close = () => overlay.remove();
    overlay.querySelector('#modal-cancel').onclick = close;

    overlay.querySelector('#modal-save').onclick = () => {
      const note = noteInput.value.trim();
      if (!note) { noteInput.focus(); return; }
      const tag = tagSelect.value || null;
      Annotations.addTopLevel({ ...range }, sourceText, note, tag);
      close();
      this._afterAnnotation();
    };
  },

  showAddChild(parentId, noteOffsetStart, noteOffsetEnd, sourceText) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>📝 添加子批注</h3>
        <div class="selected-preview">${UI.escapeHtml(sourceText)}</div>
        ${this._tagSelectHtml()}
        <textarea id="modal-note" placeholder="输入批注说明..."></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">取消</button>
          <button class="btn-primary" id="modal-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const noteInput = overlay.querySelector('#modal-note');
    const tagSelect = overlay.querySelector('#modal-tag');
    noteInput.focus();

    const close = () => overlay.remove();
    overlay.querySelector('#modal-cancel').onclick = close;

    overlay.querySelector('#modal-save').onclick = () => {
      const note = noteInput.value.trim();
      if (!note) { noteInput.focus(); return; }
      const tag = tagSelect.value || null;
      Annotations.addChild(parentId, noteOffsetStart, noteOffsetEnd, sourceText, note, tag);
      close();
      this._afterAnnotation();
    };
  },

  confirm(message, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>⚠️ 确认</h3>
        <p style="margin-bottom:14px;color:#a9b1d6;">${message}</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">取消</button>
          <button class="btn-danger" id="modal-ok">确认</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('#modal-cancel').onclick = close;
    overlay.querySelector('#modal-ok').onclick = () => { close(); onConfirm(); };
  },

  /* 导入时选择合并/覆盖 */
  showImportChoices(onMerge, onReplace) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>📥 导入批注</h3>
        <p style="margin-bottom:14px;color:#a9b1d6;">如何处理现有批注？</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">取消</button>
          <button class="btn-secondary" id="modal-merge">保留并合并</button>
          <button class="btn-primary" id="modal-replace">完全替换</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('#modal-cancel').onclick = close;
    overlay.querySelector('#modal-merge').onclick = () => { close(); onMerge(); };
    overlay.querySelector('#modal-replace').onclick = () => { close(); onReplace(); };
  },

  _afterAnnotation() {
    Annotations.refreshTopLevelStatus();
    Highlight.refreshAll();
    RightPanel.render();
    Storage.saveCurrent();
  },

  /* ====== 多文件新增 ====== */
  showNewFile(onCreate) {
    // 收集现有目录（从 docPath 推导）
    const existingDirs = new Set();
    for (const f of state.files) {
      const parts = f.docPath.split('/');
      parts.pop(); // 去掉文件名
      if (parts.length > 0) existingDirs.add(parts.join('/') + '/');
    }
    // 默认目录：如果已有 docs/ 就用它，否则用第一个目录，都没有就 docs/
    let defaultDir = 'docs/';
    if (existingDirs.has('docs/')) defaultDir = 'docs/';
    else if (existingDirs.size > 0) defaultDir = [...existingDirs][0];

    // 下拉选项：已有目录 + "新建 docs/"（去重）
    const sortedDirs = [...existingDirs].sort();
    const extraDirs = [];
    if (!existingDirs.has('docs/')) extraDirs.push({ value: 'docs/', label: 'docs/ (新建)' });

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>📄 新建文件</h3>
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">所属目录</label>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <select id="nf-dir" style="flex:1;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;">
            <option value="">(根目录)</option>
            ${sortedDirs.map(d => `<option value="${d}" ${d === defaultDir ? 'selected' : ''}>${d}</option>`).join('')}
            ${extraDirs.map(x => `<option value="${x.value}" ${x.value === defaultDir ? 'selected' : ''}>${x.label}</option>`).join('')}
          </select>
          <input id="nf-dir-custom" placeholder="或输入新目录..." style="flex:1;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;" />
        </div>
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">文件名 (.md)</label>
        <input id="fname" style="width:100%;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;margin-bottom:4px;" value="未命名.md" />
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">显示名</label>
        <input id="nf-name" style="width:100%;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;margin-bottom:4px;" value="未命名文档" />
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">完整仓库路径（自动合成，可覆盖）</label>
        <input id="nf-path" style="width:100%;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;margin-bottom:14px;background:#f6f8fa;" value="${defaultDir}未命名.md" />
        <div class="modal-actions">
          <button class="btn-secondary" id="nf-cancel">取消</button>
          <button class="btn-primary" id="nf-save">创建</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();

    // 自动合成完整路径的逻辑
    const dirSel = overlay.querySelector('#nf-dir');
    const dirCustom = overlay.querySelector('#nf-dir-custom');
    const fname = overlay.querySelector('#fname');
    const fullPath = overlay.querySelector('#nf-path');
    const recombine = () => {
      const d = dirCustom.value.trim() || dirSel.value;
      let n = fname.value.trim() || '未命名.md';
      if (!n.endsWith('.md')) n += '.md';
      fullPath.value = (d || '') + n;
    };
    dirSel.onchange = recombine;
    dirCustom.oninput = recombine;
    fname.oninput = recombine;

    overlay.querySelector('#nf-cancel').onclick = close;
    overlay.querySelector('#nf-save').onclick = () => {
      const name = overlay.querySelector('#nf-name').value.trim() || '未命名文档';
      const path = overlay.querySelector('#nf-path').value.trim();
      if (!path.endsWith('.md')) { alert('路径必须以 .md 结尾'); return; }
      close();
      onCreate(name, path);
    };
    fname.focus();
  },

  showRenameFile(file, onSave) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>✎ 重命名文件</h3>
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">显示名</label>
        <input id="rn-name" style="width:100%;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;margin-bottom:10px;" value="${UI.escapeHtml(file.name)}" />
        <label style="display:block;font-size:12px;color:#57606a;margin-bottom:4px;">仓库内路径 (.md)</label>
        <input id="rn-path" style="width:100%;padding:6px 10px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;margin-bottom:14px;" value="${UI.escapeHtml(file.docPath)}" />
        <div class="modal-actions">
          <button class="btn-secondary" id="rn-cancel">取消</button>
          <button class="btn-primary" id="rn-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('#rn-cancel').onclick = close;
    overlay.querySelector('#rn-save').onclick = () => {
      const name = overlay.querySelector('#rn-name').value.trim();
      const path = overlay.querySelector('#rn-path').value.trim();
      if (!name) { alert('名称不能为空'); return; }
      if (!path.endsWith('.md')) { alert('路径必须以 .md 结尾'); return; }
      close();
      onSave(name, path);
    };
  },
};

/* 自定义右键菜单（用于右栏卡片内的文字） */
const CtxMenu = {
  _hideHandler: null,
  _active: false,

  show(x, y, parentId, noteText, startOffset, endOffset) {
    // 如果已经有菜单在显示，先 hide 掉（但这次不自动弹新的 —— 用户要重新右键）
    // 实际上 hide() 里已经会清理 DOM，直接调用就行
    this._active = true;

    const menu = document.createElement('div');
    menu.className = 'custom-context-menu';
    menu.innerHTML = `<div class="menu-item">📝 添加子批注</div>`;
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    document.body.appendChild(menu);

    // 菜单项点击：stopPropagation 防止冒泡到 document 的 click hide handler
    menu.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const sourceText = noteText.substring(startOffset, endOffset);
      this._active = false;
      document.querySelectorAll('.custom-context-menu').forEach(m => m.remove());
      Modal.showAddChild(parentId, startOffset, endOffset, sourceText);
    });

    // 常驻 click hide handler（只注册一次，只处理 click 事件，不含 contextmenu）
    if (!this._hideHandler) {
      this._hideHandler = (e) => {
        if (!this._active) return;
        // 点击菜单自身 → 忽略（菜单项的 click 会自己 hide）
        if (e.target.closest('.custom-context-menu')) return;
        // 点击模态弹窗 → 忽略（AddChild modal 打开中）
        if (e.target.closest('.modal-overlay')) return;
        // 其他任何地方的 click → hide
        this._active = false;
        document.querySelectorAll('.custom-context-menu').forEach(m => m.remove());
      };
      document.addEventListener('click', this._hideHandler);
      // 注意：**不在 hide handler 里挂 contextmenu**！
      // contextmenu 触发时我们自己的 contextmenu handler 会接管
    }
  },

  hide() {
    this._active = false;
    document.querySelectorAll('.custom-context-menu').forEach(m => m.remove());
  },
};

/* ==================== Layer 5: 右栏卡片渲染 ==================== */
const RightPanel = {
  /* R8: 判断批注是否匹配标签筛选（空=全部，__none__=无标签） */
  _matchTag(ann) {
    const f = state.tagFilter;
    if (!f) return true;
    if (f === '__none__') return !ann.tag;
    return ann.tag === f;
  },

  render() {
    const list = document.getElementById('annotation-list');
    list.innerHTML = '';
    const keyword = state.searchKeyword.trim().toLowerCase();
    const hasFilter = keyword || state.tagFilter;

    // 统一的匹配判断
    const _match = (ann) => {
      const tagOk = this._matchTag(ann);
      if (!tagOk) return false;
      if (!keyword) return true;
      return (ann.sourceText.toLowerCase().includes(keyword) || ann.note.toLowerCase().includes(keyword));
    };

    if (!hasFilter) {
      // 无任何过滤 → 完整树形
      state.annotations.forEach(ann => {
        list.appendChild(this._buildCardWithChildren(ann, 0));
      });
    } else {
      // 有过滤 → 收集所有匹配的节点（父子都独立判断，扁平显示匹配项）
      const flat = [];
      const collect = (anns) => {
        for (const a of anns) {
          flat.push({ ann: a, depth: this._getDepth(a) });
          collect(a.children);
        }
      };
      collect(state.annotations);
      flat.forEach(({ ann }) => {
        if (_match(ann)) list.appendChild(this._buildCardWithChildren(ann, 0));
      });
    }

    // 统计
    const stats = Annotations.getStats();
    document.getElementById('stats').textContent =
      `${stats.total} 条批注 · ${stats.top} 一级 · 深度 ${stats.depth}`;

    if (state.annotations.length === 0) {
      document.getElementById('stats').textContent = '暂无批注';
    }
  },

  /* 计算某个节点的"层级深度"（用于搜索模式显示缩进） */
  _getDepth(ann, list = state.annotations, depth = 0) {
    for (const a of list) {
      if (a.id === ann.id) return depth;
      const found = this._getDepth(ann, a.children, depth + 1);
      if (found !== -1) return found;
    }
    return -1;
  },

  /* 递归构建卡片 DOM（含子批注嵌套） */
  _buildCardWithChildren(ann, depth) {
    const card = this.createCard(ann, depth, ann.parentId ? Annotations.findById(ann.parentId) : null);
    if (ann.children && ann.children.length > 0) {
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'children';
      if (state.collapsedIds.has(ann.id)) childrenWrap.classList.add('collapsed');
      ann.children.forEach(child => childrenWrap.appendChild(this._buildCardWithChildren(child, depth + 1)));
      card.appendChild(childrenWrap);
    }
    return card;
  },

  createCard(ann, depth, parentAnn) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = ann.id;
    card.dataset.depth = depth;

    if (ann.status === 'orphaned') card.classList.add('orphaned');
    if (ann.status === 'stale') card.classList.add('stale');
    // R10: 追加 tag-xxx class
    if (ann.tag && TAG_MAP[ann.tag]) card.classList.add('tag-' + ann.tag);

    // 状态标签
    if (ann.status === 'orphaned') {
      const tag = document.createElement('div');
      tag.className = 'orphaned-tag';
      tag.textContent = '⚠️ 原文已删除';
      card.appendChild(tag);
    } else if (ann.status === 'stale') {
      const tag = document.createElement('div');
      tag.className = 'stale-tag';
      tag.textContent = '⚠️ 原文已变更';
      card.appendChild(tag);
    }

    // R4: 标签 chip（可点击修改）
    if (ann.tag && TAG_MAP[ann.tag]) {
      const tagInfo = TAG_MAP[ann.tag];
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.textContent = tagInfo.label;
      chip.style.background = tagInfo.color;
      chip.title = '点击修改标签';
      chip.onclick = (e) => {
        e.stopPropagation();
        this._showTagMenu(chip, ann);
      };
      card.appendChild(chip);
    }

    // 操作按钮
    const actions = document.createElement('div');
    actions.className = 'actions';
    if (ann.parentId === null && ann.status !== 'orphaned') {
      const locateBtn = document.createElement('button');
      locateBtn.className = 'locate';
      locateBtn.title = '定位原文';
      locateBtn.textContent = '🔗';
      locateBtn.onclick = () => {
        if (ann.status !== 'orphaned') Highlight.scrollTo(ann.range);
      };
      actions.appendChild(locateBtn);
    }
    const delBtn = document.createElement('button');
    delBtn.className = 'delete';
    delBtn.title = '删除';
    delBtn.textContent = '🗑️';
    delBtn.onclick = () => {
      Modal.confirm('确定删除此批注及其全部子批注吗？', () => {
        Annotations.remove(ann.id);
        Annotations.refreshTopLevelStatus();
        Highlight.refreshAll();
        RightPanel.render();
        Storage.saveCurrent();
      });
    };
    actions.appendChild(delBtn);
    card.appendChild(actions);

    // 如果有子批注，加折叠 toggle 按钮
    if (ann.children && ann.children.length > 0) {
      card.classList.add('has-children');
      const collapsed = state.collapsedIds.has(ann.id);
      const toggle = document.createElement('button');
      toggle.className = 'collapse-toggle';
      toggle.title = collapsed ? '展开子批注' : '折叠子批注';
      toggle.textContent = collapsed ? `▸ ${ann.children.length}` : `▾ ${ann.children.length}`;
      toggle.onclick = (e) => {
        e.stopPropagation();
        if (state.collapsedIds.has(ann.id)) state.collapsedIds.delete(ann.id);
        else state.collapsedIds.add(ann.id);
        Storage.saveCurrent();
        RightPanel.render();
      };
      card.appendChild(toggle);
    }

    // 原文片段
    const sourceEl = document.createElement('div');
    sourceEl.className = 'source-text';
    sourceEl.textContent = `"${ann.sourceText}"`;
    sourceEl.title = '点击定位';
    sourceEl.onclick = () => {
      if (ann.parentId === null) {
        if (ann.status !== 'orphaned') Highlight.scrollTo(ann.range);
      } else {
        // 子批注：定位到父卡片
        const parent = Annotations.findById(ann.parentId);
        if (parent && parent.status !== 'orphaned') Highlight.scrollTo(parent.range);
      }
      // 激活卡片
      document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    };
    card.appendChild(sourceEl);

    // 批注说明（Markdown 渲染），子批注高亮锚点在渲染后叠加
    const noteEl = document.createElement('div');
    noteEl.className = 'note-content';
    noteEl.dataset.annId = ann.id;
    const renderedHtml = simpleMarkdown(ann.note || '');
    noteEl.innerHTML = renderedHtml;

    // 叠加子批注高亮锚点 mark.sub-anchor
    this._applySubAnnotationMarks(noteEl, ann);

    // 子批注在这个容器内支持右键选中文本添加孙子批注
    this._attachCardContextMenu(noteEl, ann);

    // R1: 双击进入编辑态
    noteEl.style.cursor = 'text';
    noteEl.ondblclick = () => this._enterNoteEdit(noteEl, ann);

    card.appendChild(noteEl);

    // R7: 如果有子批注处于 stale 状态，显示提示
    if (ann.children && ann.children.some(c => c.status === 'stale')) {
      const staleHint = document.createElement('div');
      staleHint.className = 'stale-child-hint';
      staleHint.textContent = '⚠️ 子批注锚点可能因父批注文本变更而偏移，请检查';
      card.appendChild(staleHint);
    }

    // stale 确认更新按钮
    if (ann.status === 'stale' && ann.parentId === null) {
      const fixBtn = document.createElement('div');
      fixBtn.className = 'stale-fix';
      fixBtn.textContent = '✓ 确认更新为当前文本';
      fixBtn.onclick = () => {
        Annotations.confirmUpdate(ann.id);
        Highlight.refreshAll();
        RightPanel.render();
        Storage.saveCurrent();
      };
      card.appendChild(fixBtn);
    }

    return card;
  },

  /* R1-R8: 进入批注说明编辑态 */
  _enterNoteEdit(noteEl, ann) {
    // R3: 先取消所有正在进行的编辑态（避免 DOM 残留）
    document.querySelectorAll('.note-editor-wrap').forEach(w => w.remove());
    document.querySelectorAll('.note-content.editing').forEach(el => {
      el.classList.remove('editing');
      el.style.display = '';
    });

    // 隐藏原 noteEl，换成编辑器
    noteEl.classList.add('editing');
    noteEl.style.display = 'none';

    const wrap = document.createElement('div');
    wrap.className = 'note-editor-wrap';

    const textarea = document.createElement('textarea');
    textarea.className = 'note-editor';
    textarea.value = ann.note || '';
    textarea.placeholder = '输入批注说明，支持 Markdown...';
    textarea.rows = Math.max(3, Math.min(15, (ann.note || '').split('\n').length + 1));
    wrap.appendChild(textarea);

    // R2: 快捷键提示
    const hint = document.createElement('div');
    hint.className = 'edit-hint';
    hint.textContent = 'Ctrl+Enter 保存 · Esc 取消';
    wrap.appendChild(hint);

    noteEl.parentNode.insertBefore(wrap, noteEl.nextSibling);
    textarea.focus();
    textarea.select();

    // R4+R5+R8: 保存逻辑
    const save = () => {
      const newVal = textarea.value.trim();
      const oldVal = ann.note || '';
      if (newVal === oldVal) {
        // 内容没变，取消即可
        this._cancelNoteEdit(wrap, noteEl);
        return;
      }
      Annotations.editNote(ann.id, newVal);
      // 直接重渲染卡片（重新 render 会带上 tag、status 等）
      Storage.saveCurrent();
      RightPanel.render();
    };

    // R3: 取消逻辑
    const cancel = () => {
      this._cancelNoteEdit(wrap, noteEl);
    };

    // R2: 快捷键
    const keyHandler = (e) => {
      // Ctrl/Cmd + Enter → 保存
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        save();
        return;
      }
      // Esc → 取消
      if (e.key === 'Escape') {
        e.preventDefault();
        cancel();
      }
    };
    textarea.addEventListener('keydown', keyHandler);

    // R3: 点击卡片外部空白处 → 取消
    const outsideHandler = (e) => {
      if (wrap.contains(e.target)) return;     // 点编辑器内部
      if (noteEl.contains(e.target)) return;   // 点原来的 noteEl（已隐藏）
      cancel();
      document.removeEventListener('mousedown', outsideHandler, true);
    };
    setTimeout(() => document.addEventListener('mousedown', outsideHandler, true), 0);
  },

  _cancelNoteEdit(wrap, noteEl) {
    wrap.remove();
    noteEl.classList.remove('editing');
    noteEl.style.display = '';
    noteEl.focus();
  },

  /* R5: 点击 chip 弹出标签修改下拉菜单 */
  _showTagMenu(anchor, ann) {
    // 关闭已有的 tag 菜单
    document.querySelectorAll('.tag-menu').forEach(m => m.remove());

    const menu = document.createElement('div');
    menu.className = 'tag-menu';

    // 生成选项
    TAG_OPTIONS.forEach(t => {
      const item = document.createElement('div');
      item.className = 'tag-menu-item';
      if (ann.tag === t.key) item.classList.add('active');
      item.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.label}`;
      item.onclick = (e) => {
        e.stopPropagation();
        Annotations.updateTag(ann.id, t.key);
        document.querySelectorAll('.tag-menu').forEach(m => m.remove());
        RightPanel.render();
        Storage.saveCurrent();
      };
      menu.appendChild(item);
    });

    // 清除标签选项
    const clearItem = document.createElement('div');
    clearItem.className = 'tag-menu-item clear';
    clearItem.textContent = '✕ 清除标签';
    clearItem.onclick = (e) => {
      e.stopPropagation();
      Annotations.updateTag(ann.id, null);
      document.querySelectorAll('.tag-menu').forEach(m => m.remove());
      RightPanel.render();
      Storage.saveCurrent();
    };
    menu.appendChild(clearItem);

    // 定位到 chip 下方
    const rect = anchor.getBoundingClientRect();
    menu.style.left = rect.left + 'px';
    menu.style.top = (rect.bottom + 4) + 'px';
    document.body.appendChild(menu);

    // 点击其他地方关闭
    const closeHandler = (e) => {
      if (e.target.closest('.tag-menu')) return;
      if (e.target === anchor) return; // chip 的 onclick 已 stopPropagation，但这里保险起见
      menu.remove();
      document.removeEventListener('click', closeHandler, true);
    };
    setTimeout(() => document.addEventListener('click', closeHandler, true), 0);
  },

  /* 在已渲染的 note HTML 上，根据子批注的 noteOffset 叠加高亮 mark */
  _applySubAnnotationMarks(noteEl, parentAnn) {
    if (!parentAnn.children || parentAnn.children.length === 0) return;

    // 找到所有子批注对应的 noteOffset，需要在纯文本上计算位置
    // 但渲染后 DOM 结构变了，偏移可能对不上 —— 所以我们换一个思路：
    // 直接在渲染好的 HTML 里找到 sourceText 出现的位置，用 mark 包裹
    // 这个方案更简单可靠

    for (const child of parentAnn.children) {
      if (child.status === 'orphaned') continue;
      const marks = noteEl.querySelectorAll(`mark.sub-anchor[data-child-id="${child.id}"]`);
      if (marks.length > 0) continue; // 已存在

      const source = child.sourceText;
      if (!source) continue;

      // 找可搜索的文本节点
      const walker = document.createTreeWalker(noteEl, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) textNodes.push(node);

      for (const txtNode of textNodes) {
        const text = txtNode.textContent;
        const idx = text.indexOf(source);
        if (idx !== -1) {
          // 拆分并包裹
          const parent = txtNode.parentNode; // 必须先保存，replaceChild 后 txtNode.parentNode 会变 null
          const before = document.createTextNode(text.substring(0, idx));
          const mark = document.createElement('mark');
          mark.className = 'sub-anchor';
          mark.dataset.childId = child.id;
          mark.textContent = source;
          const after = document.createTextNode(text.substring(idx + source.length));
          parent.replaceChild(after, txtNode);
          parent.insertBefore(mark, after);
          parent.insertBefore(before, mark);

          // mark 点击 → 定位子批注卡片 + 滚动
          mark.onclick = (e) => {
            e.stopPropagation();
            const subCard = noteEl.closest('.card').parentElement.querySelector(`.card[data-id="${child.id}"]`);
            if (subCard) {
              document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
              subCard.classList.add('active');
              subCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          };
          break;
        }
      }
    }
  },

  /* 给卡片内容区绑定右键 → 选中文本添加子批注 */
  _attachCardContextMenu(noteEl, ann) {
    // 给整个右栏一个统一的 contextmenu 监听，在这里判断是否在卡片内选中了文字
  },
};

/* 右栏统一右键监听 —— 选中文本 → 弹出自定义菜单添加子批注 */
document.addEventListener('contextmenu', (e) => {
  const sel = window.getSelection();
  const text = sel.toString().trim();

  // 1. 如果右键目标在自定义菜单自身上 → 隐藏菜单（让浏览器默认右键处理），然后 return
  if (e.target.closest('.custom-context-menu')) {
    CtxMenu.hide();
    return;
  }

  // 2. 先清掉可能残留的旧菜单 DOM（保险起见）
  document.querySelectorAll('.custom-context-menu').forEach(m => m.remove());
  CtxMenu._active = false;

  // 3. 没选中文字 → 不处理，让浏览器默认右键菜单弹出来
  if (!text) return;

  // 4. 判断选中是否在右栏卡片内（不是的话让默认菜单弹出）
  const cardEl = e.target.closest('.card .note-content, .card .source-text');
  if (!cardEl) return;

  // 5. 找到所属批注 id
  const card = e.target.closest('.card');
  const annId = card?.dataset?.id;
  if (!annId) return;

  const ann = Annotations.findById(annId);
  if (!ann) return;

  // 6. 在父级 note 纯文本中查找选中文本的位置（模糊匹配带 Markdown 包裹的情况）
  let offsetStart = -1, offsetEnd = -1;

  // 直接匹配
  offsetStart = ann.note.indexOf(text);

  // 没匹配到 → 尝试去掉 Markdown 标记后的模糊匹配
  if (offsetStart < 0) {
    const escaped = text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const patterns = [
      new RegExp(`\\*\\*${escaped}\\*\\*`),       // **包裹
      new RegExp(`\\*${escaped}\\*`),             // *包裹
      new RegExp(`\\\`${escaped}\\\``),           // `包裹
      new RegExp(escaped),                        // 直接
    ];
    for (const pat of patterns) {
      const m = pat.exec(ann.note);
      if (m) {
        offsetStart = m.index;
        offsetEnd = m.index + text.length;
        break;
      }
    }
  }

  if (offsetStart < 0) return;
  if (offsetEnd < 0) offsetEnd = offsetStart + text.length;

  // 7. 阻止浏览器默认菜单 + 显示自定义菜单
  e.preventDefault();
  CtxMenu.show(e.clientX, e.clientY, annId, ann.note, offsetStart, offsetEnd);
});

/* ==================== Files: 多文件管理模块 ==================== */
const Files = {
  /* 刷新下拉框 */
  updateSwitcher() {
    const sel = document.getElementById('file-select');
    if (!sel) return;
    sel.innerHTML = '';
    for (const f of state.files) {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = f.name;
      opt.title = f.docPath;
      if (f.id === state.currentFileId) opt.selected = true;
      sel.appendChild(opt);
    }
    // 同时刷新目录树侧边栏（如有）
    if (typeof DirectoryTree !== 'undefined') DirectoryTree.render();
  },

  /* 切换（下拉 change） */
  onSelectChange(e) {
    const id = e.target.value;
    if (id && id !== state.currentFileId) Storage.switchToFile(id);
  },

  /* 新建 */
  newFile() {
    Modal.showNewFile((name, docPath) => {
      const file = Storage.createFile(name, docPath);
      Files.updateSwitcher();
      Storage.switchToFile(file.id);
    });
  },

  /* 重命名 */
  renameCurrent() {
    const cur = state.files.find(f => f.id === state.currentFileId);
    if (!cur) return;
    Modal.showRenameFile(cur, (name, docPath) => {
      Storage.renameFile(cur.id, name, docPath);
      Files.updateSwitcher();
      UI.setSaveStatus('已重命名');
    });
  },

  /* 删除 */
  deleteCurrent() {
    if (state.files.length <= 1) {
      alert('至少保留一个文件。');
      return;
    }
    const cur = state.files.find(f => f.id === state.currentFileId);
    if (!cur) return;
    Modal.confirm(`确定删除文件「${cur.name}」及其全部批注吗？此操作不可撤销。`, () => {
      Storage.deleteFile(cur.id);
      const nextId = state.files[0].id;
      Files.updateSwitcher();
      Storage.switchToFile(nextId);
    });
  },
};

/* ==================== Layer 5.5: 移动端阅读模式 ==================== */
const MobileReader = {
  _isMobile: false,

  /* 判断是否移动端（首次用媒体查询，后续用 resize 事件） */
  isMobile() {
    return window.matchMedia('(max-width: 768px)').matches;
  },

  init() {
    this._isMobile = this.isMobile();
    if (!this._isMobile) return;

    // 移动端不加载 Monaco —— 先确保 AMD loader 不阻塞（require.config 在 Editor.init 里）
    // 但 Monaco loader.js 仍然会加载（HTML 里已引用），require 是全局的，只是我们不调用 Editor.init()
    // 在移动端改用直接初始化流程

    // 1. 先从 v1 迁移（Storage 层独立，不依赖 Monaco）
    Storage.migrateV1toV2();

    // 2. 加载文件索引
    let idx = Storage.loadIndex();
    if (!idx || !idx.files || idx.files.length === 0) {
      const f = Storage.createFile('未命名文档', 'docs/未命名.md');
      idx = { currentFileId: f.id, files: [f] };
    }
    state.files = idx.files;
    state.currentFileId = idx.currentFileId || idx.files[0].id;

    // 3. 加载当前文件数据
    const currentData = Storage.loadFile(state.currentFileId);
    const initialContent = currentData ? currentData.docContent : DEFAULT_DOC;
    state.annotations = currentData ? currentData.annotations : [];
    state.collapsedIds = new Set(currentData && Array.isArray(currentData.collapsedIds) ? currentData.collapsedIds : []);
    state.docContent = initialContent; // 移动端也存一份文档内容

    // 4. 渲染
    this.renderMarkdown();
    this.renderAnnotations();
    this.renderMobileDirectory();

    // 5. 绑定交互
    this._bindTouchSelection();
    this._bindPanelDrag();
    this._bindDrawer();
    this._bindFilter();

    // 6. 底部面板默认展开一半（50vh）
    this._setPanelHeight('50vh');

    // 7. 监听文件切换
    document.addEventListener('mobile-file-switch', () => {
      this.renderMarkdown();
      this.renderAnnotations();
    });

    // 8. resize 处理
    window.addEventListener('resize', () => {
      this._isMobile = this.isMobile();
    });

    console.log('[MobileReader] 移动端阅读模式已启动');
  },

  /* 渲染 Markdown + 批注高亮 */
  renderMarkdown() {
    const container = document.getElementById('mobile-markdown');
    if (!container || !state.docContent) return;

    // 先用 simpleMarkdown 渲染
    let html = simpleMarkdown(state.docContent);
    container.innerHTML = html;

    // 注入顶层批注高亮（复用 TreeWalker + sourceText indexOf 方案）
    this._injectAnnotationHighlights(container);
  },

  /* 在渲染后的 Markdown DOM 中注入批注高亮 */
  _injectAnnotationHighlights(container) {
    if (!state.annotations || state.annotations.length === 0) return;

    for (const ann of state.annotations) {
      if (ann.parentId !== null) continue; // 只处理顶层批注
      if (ann.status === 'orphaned') continue;
      const source = ann.sourceText;
      if (!source || source.length === 0) continue;

      // 检查是否已经高亮过
      if (container.querySelector(`mark.ann-highlight[data-ann-id="${ann.id}"]`)) continue;

      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) textNodes.push(node);

      for (const txtNode of textNodes) {
        const text = txtNode.textContent;
        const idx = text.indexOf(source);
        if (idx !== -1) {
          const parent = txtNode.parentNode;
          if (!parent) continue;
          // 避免在 code/pre 内包裹（这些区域文本匹配不精确）—— 跳过继续找
          if (parent.closest('code, pre')) continue;

          const before = document.createTextNode(text.substring(0, idx));
          const mark = document.createElement('mark');
          mark.className = 'ann-highlight';
          mark.dataset.annId = ann.id;
          mark.textContent = source;
          const after = document.createTextNode(text.substring(idx + source.length));
          parent.replaceChild(after, txtNode);
          parent.insertBefore(mark, after);
          parent.insertBefore(before, mark);

          // 点击高亮 → 定位批注卡片
          mark.addEventListener('click', (e) => {
            e.stopPropagation();
            this._scrollToAnnotation(ann.id);
          });
          break;
        }
      }
    }
  },

  /* 渲染底部批注面板 */
  renderAnnotations() {
    const list = document.getElementById('mobile-annotation-list');
    const countEl = document.getElementById('mobile-panel-count');
    if (!list) return;

    // 筛选
    const search = (document.getElementById('mobile-search')?.value || '').toLowerCase();
    const tagFilter = document.getElementById('mobile-tag-filter')?.value || '';

    let filtered = state.annotations.filter(a => {
      if (a.parentId !== null) return false; // 顶层批注
      if (a.status === 'orphaned') return false;
      if (search) {
        const match = (a.sourceText || '').toLowerCase().includes(search) ||
                      (a.note || '').toLowerCase().includes(search);
        if (!match) {
          // 子批注命中也算 —— 但这里先只显示顶层，子批注在卡片里内嵌
          return false;
        }
      }
      if (tagFilter) {
        if (tagFilter === '__none__' && a.tag !== null) return false;
        if (tagFilter !== '__none__' && a.tag !== tagFilter) return false;
      }
      return true;
    });

    countEl.textContent = `${filtered.length} 条`;

    // 渲染卡片（含内嵌子批注）
    list.innerHTML = filtered.map(ann => this._renderCardTree(ann)).join('');

    // 绑定所有卡片交互（顶层和子层）
    list.querySelectorAll('.card').forEach(cardEl => {
      const id = cardEl.dataset.id;
      const ann = state.annotations.find(a => a.id === id);
      if (!ann) return;

      // 点击卡片 → 定位（顶层滚文档，子批注不触发滚文档因为没有独立锚点）
      cardEl.addEventListener('click', (e) => {
        if (e.target.closest('.card-actions, button, textarea, .card-children')) return;
        if (ann.parentId === null) this._scrollToAnnotation(id);
      });

      // 双击 → 编辑
      cardEl.addEventListener('dblclick', (e) => {
        if (e.target.closest('.card-actions, .card-children')) return;
        this._enterCardEdit(cardEl, ann);
      });

      // 折叠/展开子批注
      const toggle = cardEl.querySelector('.card-children-toggle');
      if (toggle) {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const sub = cardEl.querySelector('.card-children');
          if (sub) {
            const hidden = sub.style.display === 'none';
            sub.style.display = hidden ? '' : 'none';
            toggle.textContent = hidden ? '🔻 收起' : '▶️ 展开';
          }
        });
      }
    });
  },

  /* 渲染批注卡片树（含子批注） */
  _renderCardTree(ann, depth = 0) {
    const tagInfo = ann.tag ? TAG_MAP[ann.tag] : null;
    const tagChip = tagInfo ? `<span class="tag-chip" style="background:${tagInfo.color}">${tagInfo.label}</span>` : '';
    const source = UI.escapeHtml(ann.sourceText || '');
    const noteHtml = simpleMarkdown(ann.note || '');
    const children = (ann.children || []).filter(c => c.status !== 'orphaned');
    const isStale = ann.status === 'stale';

    const indent = depth * 12; // 子批注缩进

    let html = `
      <div class="card ${ann.tag ? 'tag-' + ann.tag : ''} ${isStale ? 'stale' : ''}" data-id="${ann.id}" style="margin-left:${indent}px">
        ${tagChip}
        ${isStale ? '<span class="stale-tag">⚠️ 锚点偏移</span>' : ''}
        <div class="source-text">「${source}」</div>
        <div class="note-body">${noteHtml}</div>
    `;

    if (children.length > 0) {
      html += `<div class="card-children-toggle" style="font-size:11px;color:#0969da;margin-top:6px;cursor:pointer;user-select:none;padding:4px 0;">▶️ 展开 ${children.length} 条子批注</div>`;
      html += `<div class="card-children" style="display:none;margin-top:8px;border-left:2px solid #d0d7de;padding-left:8px;">`;
      for (const child of children) {
        html += this._renderCardTree(child, depth + 1);
      }
      html += `</div>`;
    }

    html += `</div>`;
    return html;
  },

  /* 渲染移动端目录树（汉堡抽屉内） */
  renderMobileDirectory() {
    const container = document.getElementById('mobile-directory-tree');
    if (!container) return;
    // 复用 DirectoryTree.render() 的逻辑，但目标容器不同
    // 简单做法：先 render 到原容器，再 innerHTML 复制过来
    DirectoryTree.render();
    const original = document.getElementById('directory-tree');
    container.innerHTML = original ? original.innerHTML : '';

    // 重绑点击事件（因为 innerHTML 会销毁原事件）
    container.querySelectorAll('.tree-file').forEach(el => {
      el.addEventListener('click', () => {
        const fileId = el.dataset.id; // DirectoryTree 用的是 data-id
        if (fileId && fileId !== state.currentFileId) {
          Storage.switchToFile(fileId);
          this.renderMarkdown();
          this.renderAnnotations();
          this.renderMobileDirectory();
          this.hideDrawer();
          // 同步桌面端 file-select（如果有的话）
          const fs = document.getElementById('file-select');
          if (fs) fs.value = fileId;
        }
      });
    });
    // 重绑目录折叠
    container.querySelectorAll('.tree-folder-header').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const folder = el.parentElement;
        folder.classList.toggle('folder-collapsed');
      });
    });
  },

  /* 滚动到指定批注的高亮位置 */
  _scrollToAnnotation(annId) {
    const container = document.getElementById('mobile-markdown');
    if (!container) return;
    // 先清除旧 active
    container.querySelectorAll('mark.ann-highlight.active').forEach(m => m.classList.remove('active'));
    const mark = container.querySelector(`mark.ann-highlight[data-ann-id="${annId}"]`);
    if (mark) {
      mark.classList.add('active');
      // 用 scrollTop 精确滚动，避开 fixed 底部面板遮挡
      const containerRect = container.getBoundingClientRect();
      const markRect = mark.getBoundingClientRect();
      const offset = markRect.top - containerRect.top + container.scrollTop;
      // 目标位置：mark 上方留 40px（约 2 行），同时避开底部面板（大约 50vh）
      const target = Math.max(0, offset - 40);
      container.scrollTo({ top: target, behavior: 'smooth' });

      // 同时高亮底部面板的卡片
      const cardList = document.getElementById('mobile-annotation-list');
      if (cardList) {
        cardList.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
        const card = cardList.querySelector(`.card[data-id="${annId}"]`);
        if (card) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => card.classList.remove('active'), 800);
        }
      }
      setTimeout(() => mark.classList.remove('active'), 2000);
    } else {
      container.scrollTo({ top: 0, behavior: 'smooth' });
    }
  },

  /* ========== 汉堡抽屉 ========== */
  showDrawer() {
    const drawer = document.getElementById('mobile-drawer');
    drawer.classList.add('drawer-open');
    document.body.classList.add('drawer-overlay');
    this.renderMobileDirectory();
  },

  hideDrawer() {
    const drawer = document.getElementById('mobile-drawer');
    drawer.classList.remove('drawer-open');
    document.body.classList.remove('drawer-overlay');
  },

  _bindDrawer() {
    const btn = document.getElementById('btn-toggle-sidebar');
    const closeBtn = document.getElementById('drawer-close');
    if (btn) btn.addEventListener('click', () => this.showDrawer());
    if (closeBtn) closeBtn.addEventListener('click', () => this.hideDrawer());
    // 点击遮罩关闭
    document.addEventListener('click', (e) => {
      if (document.body.classList.contains('drawer-overlay') &&
          !e.target.closest('#mobile-drawer') &&
          !e.target.closest('#btn-toggle-sidebar')) {
        this.hideDrawer();
      }
    });
  },

  /* ========== 底部面板拖拽（三档：收起/对半分/顶部） ========== */
  _bindPanelDrag() {
    const handle = document.getElementById('panel-handle');
    const panel = document.getElementById('mobile-panel');
    if (!handle || !panel) return;

    // 三档高度（统一用 vh 字符串，避免数字/字符串混用导致的状态错乱）
    const H_COLLAPSED = '12vh';   // 收起：只露标题条
    const H_HALF      = '50vh';   // 对半分
    const H_FULL      = '90vh';   // 顶部：几乎全屏

    let startY = 0, startHeight = 0, dragging = false;
    let lastTouchEnd = 0;

    handle.addEventListener('touchstart', (e) => {
      dragging = true;
      startY = e.touches[0].clientY;
      startHeight = panel.getBoundingClientRect().height;
      e.preventDefault();
    }, { passive: false });

    handle.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const dy = startY - e.touches[0].clientY; // 向上拖 → 面板变高
      const vh = window.innerHeight;
      const MAX_PX = vh * 0.92;
      const MIN_PX = vh * 0.10;
      const newHeight = Math.max(MIN_PX, Math.min(MAX_PX, startHeight + dy));
      panel.style.height = newHeight + 'px';
      panel.style.maxHeight = 'none';
      document.documentElement.style.setProperty('--panel-height', newHeight + 'px');
      e.preventDefault();
    }, { passive: false });

    handle.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      lastTouchEnd = Date.now();

      const h = panel.getBoundingClientRect().height;
      const vh = window.innerHeight;
      const ratio = h / vh;

      let target;
      if (ratio < 0.3) target = H_COLLAPSED;
      else if (ratio < 0.7) target = H_HALF;
      else target = H_FULL;

      this._setPanelHeight(target);
    });

    // 点击 handle 切换：对半 ↔ 收起
    handle.addEventListener('click', () => {
      if (Date.now() - lastTouchEnd < 400) return;
      const state = panel.dataset.panelState || 'half';
      if (state === 'collapsed') this._setPanelHeight(H_HALF);
      else this._setPanelHeight(H_COLLAPSED);
    });
  },

  /* 设置面板高度并同步状态（只接受 vh 字符串） */
  _setPanelHeight(height) {
    const panel = document.getElementById('mobile-panel');
    if (!panel) return;
    panel.style.height = '';
    panel.style.maxHeight = height;
    document.documentElement.style.setProperty('--panel-height', height);

    if (height === '12vh') panel.dataset.panelState = 'collapsed';
    else if (height === '50vh') panel.dataset.panelState = 'half';
    else panel.dataset.panelState = 'full';
  },

  /* ========== 添加批注统一入口（➕按钮） ========== */
  _bindTouchSelection() {
    const container = document.getElementById('mobile-markdown');
    const addBtn = document.getElementById('panel-add-btn');
    const cardList = document.getElementById('mobile-annotation-list');
    if (!container || !addBtn) {
      console.warn('[MobileReader] _bindTouchSelection 缺少元素:', { container, addBtn });
      return;
    }
    console.log('[MobileReader] _bindTouchSelection 初始化完成');

    // ==== 缓存选区（防浏览器清选区） ====
    let _pendingSelection = null;
    let _clearPendingTimer = null;
    let _protectUntil = 0; // 保护窗口截止时间戳

    const cacheSelection = () => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const text = sel.toString().trim();
      if (!text) return;

      const ancestor = range.commonAncestorContainer;
      const el = ancestor.nodeType === 1 ? ancestor : ancestor.parentElement;
      console.log('[MobileReader] cacheSelection 触发', { text: text.slice(0, 20), inDoc: container.contains(el), inCard: cardList?.contains(el) });

      if (container.contains(el)) {
        _pendingSelection = { text, parentId: null };
      } else if (cardList && cardList.contains(el)) {
        const card = el.closest('.card');
        if (card) {
          _pendingSelection = { text, parentId: card.dataset.id };
        }
      }

      // 缓存成功 → 开 2 秒保护窗口（鸿蒙/安卓长按会连续触发 true→false）
      _protectUntil = Date.now() + 2000;
      console.log('[MobileReader] _pendingSelection =', _pendingSelection, '保护至:', _protectUntil);

      if (_pendingSelection) {
        if (_pendingSelection.parentId) {
          addBtn.classList.add('child-mode');
          addBtn.title = '添加子批注';
        } else {
          addBtn.classList.remove('child-mode');
          addBtn.title = '添加父批注';
        }
      }
    };

    const clearPendingSoon = () => {
      // 保护窗口内 → 不清
      if (Date.now() < _protectUntil) {
        console.log('[MobileReader] clearPendingSoon 被保护窗口拦截');
        return;
      }
      clearTimeout(_clearPendingTimer);
      _clearPendingTimer = setTimeout(() => {
        console.log('[MobileReader] clearPendingSoon 清缓存');
        _pendingSelection = null;
        addBtn.classList.remove('child-mode');
        addBtn.title = '添加批注（先选文字或点击批注卡片）';
      }, 400);
    };

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection();
      const hasSel = sel && !sel.isCollapsed;
      console.log('[MobileReader] selectionchange 触发, hasSelection:', hasSel, 'collapsed:', sel?.isCollapsed);
      if (!hasSel) {
        clearPendingSoon();
      } else {
        clearTimeout(_clearPendingTimer);
        cacheSelection();
      }
    });

    if (cardList) {
      cardList.addEventListener('click', (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        if (e.target.closest('.card-actions, button, textarea, input')) return;
        console.log('[MobileReader] 点击卡片:', card.dataset.id);

        if (!_pendingSelection) {
          _pendingSelection = { text: null, parentId: card.dataset.id };
          addBtn.classList.add('child-mode');
          addBtn.title = '添加子批注';
        }
      });
    }

    addBtn.addEventListener('click', () => {
      console.log('[MobileReader] ➕按钮点击, _pendingSelection =', _pendingSelection);
      if (!_pendingSelection) {
        this._toast('请先选文字，或点击一条批注卡片');
        return;
      }

      if (_pendingSelection.parentId) {
        const parent = Annotations.findById(_pendingSelection.parentId);
        if (!parent) {
          _pendingSelection = null;
          return;
        }
        this._showAddChildModal(parent, _pendingSelection.text);
      } else if (_pendingSelection.text) {
        this._showAddAnnotationModal(_pendingSelection.text);
        try { window.getSelection().removeAllRanges(); } catch(_) {}
      }

      _pendingSelection = null;
      addBtn.classList.remove('child-mode');
      addBtn.title = '添加批注（先选文字或点击批注卡片）';
    });
  },

  /* 轻量 toast 提示 */
  _toast(msg) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;pointer-events:none;transition:opacity 0.3s;';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; }, 1500);
    setTimeout(() => el.remove(), 2000);
  },

  /* 移动端添加子批注弹窗 —— 支持传入选中文本作为 sourceText */
  _showAddChildModal(parent, selectedText) {
    const sourceForChild = selectedText || parent.sourceText || '';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>🔗 添加子批注</h3>
        <div style="font-size:12px;color:#57606a;margin-bottom:6px;">父批注：</div>
        <div class="selected-preview">${UI.escapeHtml((parent.sourceText || '') + ' — ' + (parent.note || '').slice(0, 60))}</div>
        ${selectedText ? `<div style="font-size:12px;color:#0969da;margin:8px 0 4px;">选中文本（作为子批注锚点）：</div><div class="selected-preview">${UI.escapeHtml(selectedText)}</div>` : ''}
        ${Modal._tagSelectHtml()}
        <textarea id="mobile-child-note" placeholder="输入子批注内容..."></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" id="mobile-child-cancel">取消</button>
          <button class="btn-primary" id="mobile-child-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const close = () => overlay.remove();
    overlay.querySelector('#mobile-child-cancel').onclick = close;
    overlay.querySelector('#mobile-child-save').onclick = () => {
      const note = overlay.querySelector('#mobile-child-note').value.trim();
      if (!note) { close(); return; }
      const tag = overlay.querySelector('#mobile-child-tag').value || null;

      const child = Annotations.addChild(parent.id, 0, sourceForChild.length, sourceForChild, note, tag);
      if (child) {
        Storage.saveCurrent();
        MobileReader.refresh();
      }
      close();
    };
  },

  /* 移动端新建批注弹窗 —— 自建不依赖 Modal._afterAnnotation */
  _showAddAnnotationModal(sourceText) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>📝 添加批注</h3>
        <div class="selected-preview">${UI.escapeHtml(sourceText)}</div>
        ${Modal._tagSelectHtml()}
        <textarea id="mobile-add-note" placeholder="输入批注说明，支持 Markdown 语法..."></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" id="mobile-add-cancel">取消</button>
          <button class="btn-primary" id="mobile-add-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const noteInput = overlay.querySelector('#mobile-add-note');
    const tagSelect = overlay.querySelector('#modal-tag');
    noteInput.focus();

    const close = () => overlay.remove();
    overlay.querySelector('#mobile-add-cancel').onclick = close;

    overlay.querySelector('#mobile-add-save').onclick = () => {
      const note = noteInput.value.trim();
      if (!note) { noteInput.focus(); return; }
      const tag = tagSelect.value || null;
      const mockRange = { startLineNumber: 1, startColumn: 1, endLineNumber: 1, endColumn: sourceText.length };
      Annotations.addTopLevel(mockRange, sourceText, note, tag);
      Storage.saveCurrent();
      close();
      this.renderMarkdown();
      this.renderAnnotations();
    };
  },

  /* ========== 筛选绑定 ========== */
  _bindFilter() {
    const search = document.getElementById('mobile-search');
    const tagFilter = document.getElementById('mobile-tag-filter');
    if (search) search.addEventListener('input', () => this.renderAnnotations());
    if (tagFilter) tagFilter.addEventListener('change', () => this.renderAnnotations());
  },

  /* ========== 卡片编辑（自建弹窗） ========== */
  _enterCardEdit(cardEl, ann) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>✏️ 编辑批注</h3>
        <div class="selected-preview">「${UI.escapeHtml(ann.sourceText || '')}」</div>
        <textarea id="mobile-edit-note" placeholder="输入批注内容..." style="min-height:100px">${UI.escapeHtml(ann.note || '')}</textarea>
        <div class="modal-actions">
          <button class="btn-secondary" id="mobile-edit-cancel">取消</button>
          <button class="btn-primary" id="mobile-edit-save">保存</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const textarea = overlay.querySelector('#mobile-edit-note');
    textarea.focus();

    const close = () => overlay.remove();
    overlay.querySelector('#mobile-edit-cancel').onclick = close;
    overlay.querySelector('#mobile-edit-save').onclick = () => {
      const newNote = textarea.value.trim();
      if (!newNote) { textarea.focus(); return; }
      const oldNote = ann.note || '';
      ann.note = newNote;
      // 父批注编辑后，重算子批注偏移
      Annotations.recalcChildOffsets(ann.id, oldNote, newNote);
      Storage.saveCurrent();
      close();
      this.renderMarkdown();
      this.renderAnnotations();
    };
  },
};

/* ==================== Layer 6: UI 工具 + 工具栏 ==================== */
const UI = {
  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  setSaveStatus(text) {
    document.getElementById('save-status').textContent = text;
  },

  toggleReadOnly() {
    if (!state.monaco) return; // Monaco 还没初始化
    state.readOnly = !state.readOnly;
    state.monaco.updateOptions({ readOnly: state.readOnly });
    const btn = document.getElementById('btn-readonly');
    btn.textContent = state.readOnly ? '🔒 只读模式' : '✏️ 编辑模式';
    btn.classList.toggle('active', state.readOnly);
    Storage.saveCurrent();
  },

  toggleHighlight() {
    state.showHighlight = !state.showHighlight;
    const btn = document.getElementById('btn-toggle-highlight');
    btn.textContent = state.showHighlight ? '👁️ 高亮' : '👁️‍🗨️ 隐藏高亮';
    btn.classList.toggle('active', !state.showHighlight);
    Highlight.refreshAll();
    // 移动端：用 CSS 去掉/恢复 mark 高亮背景
    const mdContainer = document.getElementById('mobile-markdown');
    if (mdContainer) {
      mdContainer.querySelectorAll('mark.ann-highlight').forEach(m => {
        m.style.background = state.showHighlight ? '' : 'transparent';
      });
    }
  },

  exportJson() {
    const curFile = state.files.find(f => f.id === state.currentFileId);
    const data = {
      version: DATA_VERSION,
      exportedAt: new Date().toISOString(),
      fileId: state.currentFileId,
      fileName: curFile?.name || '未命名',
      docPath: curFile?.docPath || '',
      docContent: state.monaco.getValue(),
      annotations: state.annotations,
      collapsedIds: Array.from(state.collapsedIds),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = (curFile?.name || 'annotations').replace(/[\\/:*?"<>|]/g, '_');
    a.download = `${safeName}.annotations.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  triggerImport() {
    document.getElementById('file-input').click();
  },
};

/* ==================== Guideline: SVG 虚线指引连线 ==================== */
const Guideline = {
  _svg: null,
  _debounceTimer: null,

  /* ---------- 初始化 ---------- */
  init() {
    // 恢复持久化模式
    try {
      const saved = localStorage.getItem(GUIDELINE_MODE_KEY);
      if (saved === 'smart' || saved === 'all' || saved === 'off') {
        state.guidelineMode = saved;
      }
    } catch (e) {}

    this._svg = document.getElementById('guideline-layer');
    this._updateButtonUI();
    this._bindEvents();
    this.render();
  },

  /* ---------- 绑定事件：hover、点击、滚动、resize、折叠 ---------- */
  _bindEvents() {
    // 右栏卡片 hover（事件委托到 annotation-list）
    const list = document.getElementById('annotation-list');
    list.addEventListener('mouseover', (e) => {
      if (state.guidelineMode !== 'smart') return;
      const card = e.target.closest('.card');
      if (!card) return;
      if (card.classList.contains('orphaned')) return;
      const id = card.dataset.id;
      if (!id || state.guidelineHoverId === id) return;
      state.guidelineHoverId = id;
      card.classList.add('guideline-hover');
      this._debouncedRender();
    });
    list.addEventListener('mouseout', (e) => {
      if (state.guidelineMode !== 'smart') return;
      const card = e.target.closest('.card');
      if (!card) return;
      // 检查是否真正移出了卡片（mouseout 会冒泡到子元素，用 relatedTarget 判断）
      if (card.contains(e.relatedTarget)) return;
      const id = card.dataset.id;
      card.classList.remove('guideline-hover');
      if (state.guidelineHoverId === id) state.guidelineHoverId = null;
      this._debouncedRender();
    });

    // 卡片点击：聚焦 / 取消聚焦（智能模式）
    list.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      const id = card.dataset.id;
      if (!id) return;
      if (card.classList.contains('orphaned')) return;

      if (state.guidelineMode === 'smart') {
        if (state.guidelineFocusedIds.has(id)) {
          state.guidelineFocusedIds.delete(id);
          card.classList.remove('guideline-focused');
        } else {
          state.guidelineFocusedIds.add(id);
          card.classList.add('guideline-focused');
          // 右栏卡片点击 → 左栏滚动定位（一级批注才有 range）
          const ann = Annotations.findById(id);
          if (ann && ann.parentId === null && ann.status !== 'orphaned') {
            Highlight.scrollTo(ann.range);
          }
        }
        this._debouncedRender();
      }
      // 永久显示模式下 Shift 点击 = 多激活叠加
      else if (state.guidelineMode === 'all' && e.shiftKey) {
        if (state.guidelineFocusedIds.has(id)) {
          state.guidelineFocusedIds.delete(id);
          card.classList.remove('guideline-focused');
        } else {
          state.guidelineFocusedIds.add(id);
          card.classList.add('guideline-focused');
        }
        this._debouncedRender();
      }
    });

    // 左栏高亮文本点击 → 触发对应的虚线指引（智能模式）
    const monacoDom = document.getElementById('monaco-container');
    monacoDom.addEventListener('click', (e) => {
      if (state.guidelineMode !== 'smart') return;
      // Monaco 内部 text 点击后，需要找到对应的 range
      // 通过 monaco 的当前 selection 或 装饰器位置来定位
      const annIds = this._findAnnotationsAtClickPoint();
      if (annIds.length > 0) {
        // 聚焦第一个匹配的
        const id = annIds[0];
        state.guidelineFocusedIds.add(id);
        const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
        if (card) {
          card.classList.add('guideline-focused');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        this._debouncedRender();
      }
    });

    // Esc 清除所有临时聚焦
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.guidelineFocusedIds.size > 0 || state.guidelineHoverId) {
          state.guidelineFocusedIds.clear();
          state.guidelineHoverId = null;
          document.querySelectorAll('.card.guideline-hover, .card.guideline-focused')
            .forEach(c => c.classList.remove('guideline-hover', 'guideline-focused'));
          this.render();
        }
      }
    });

    // 滚动：Monaco + 右栏
    const debouncedRender = () => this._debouncedRender();
    if (state.monaco) {
      state.monaco.onDidScrollChange(debouncedRender);
    }
    const rightPanel = document.getElementById('right');
    rightPanel.addEventListener('scroll', debouncedRender);

    // window resize
    window.addEventListener('resize', debouncedRender);

    // 右栏 DOM 变化（RightPanel.render() 重建卡片后自动重绘）
    const mo = new MutationObserver(() => {
      this._debouncedRender();
    });
    mo.observe(list, { childList: true, subtree: true });
  },

  /* ---------- 三态切换 ---------- */
  toggleMode() {
    const order = ['smart', 'all', 'off'];
    const idx = order.indexOf(state.guidelineMode);
    state.guidelineMode = order[(idx + 1) % 3];

    // 模式切换时清理临时聚焦态
    state.guidelineFocusedIds.clear();
    state.guidelineHoverId = null;
    document.querySelectorAll('.card.guideline-hover, .card.guideline-focused')
      .forEach(c => c.classList.remove('guideline-hover', 'guideline-focused'));

    try { localStorage.setItem(GUIDELINE_MODE_KEY, state.guidelineMode); } catch (e) {}
    this._updateButtonUI();
    this.render();
  },

  _updateButtonUI() {
    const btn = document.getElementById('btn-toggle-guideline');
    if (!btn) return;
    const labels = { smart: '🔗 虚线', all: '🔗 全连', off: '🔗 关闭' };
    const titles = {
      smart: '虚线指引：智能模式（hover/聚焦触发）｜点击切换',
      all: '虚线指引：永久显示全部｜点击切换',
      off: '虚线指引：已关闭｜点击切换',
    };
    btn.textContent = labels[state.guidelineMode];
    btn.title = titles[state.guidelineMode];
    btn.classList.toggle('active', state.guidelineMode !== 'smart');
  },

  /* ---------- 防抖重绘（16ms ≈ 1 帧） ---------- */
  _debouncedRender() {
    if (this._debounceTimer) clearTimeout(this._debounceTimer);
    this._debounceTimer = setTimeout(() => this.render(), 16);
  },

  /* ---------- 主渲染方法 ---------- */
  render() {
    if (!this._svg) return;

    // 先清理所有旧的 guideline class，再根据当前 state 重新标记
    document.querySelectorAll('.card.guideline-hover, .card.guideline-focused')
      .forEach(c => c.classList.remove('guideline-hover', 'guideline-focused'));

    // 过滤掉已经不存在于 annotations 中的 id（删除/刷新后）
    const validIds = new Set();
    const walkAll = (list) => {
      for (const a of list) {
        validIds.add(a.id);
        if (a.children && a.children.length) walkAll(a.children);
      }
    };
    walkAll(state.annotations);
    state.guidelineFocusedIds = new Set([...state.guidelineFocusedIds].filter(id => validIds.has(id)));
    if (state.guidelineHoverId && !validIds.has(state.guidelineHoverId)) state.guidelineHoverId = null;

    // 给有效的 card DOM 重新打标记（RightPanel.render() 重建 DOM 后补标记）
    state.guidelineFocusedIds.forEach(id => {
      const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if (card) card.classList.add('guideline-focused');
    });
    if (state.guidelineHoverId) {
      const card = document.querySelector(`.card[data-id="${CSS.escape(state.guidelineHoverId)}"]`);
      if (card) card.classList.add('guideline-hover');
    }

    // 关闭模式：隐藏 SVG 并清空所有 path
    if (state.guidelineMode === 'off') {
      this._svg.classList.add('hidden');
      this._svg.innerHTML = '';
      return;
    }

    this._svg.classList.remove('hidden');

    // 根据模式确定需要绘制的批注 id 集合
    let targetIds = new Set();

    if (state.guidelineMode === 'smart') {
      // 智能模式：hover + 聚焦的
      if (state.guidelineHoverId) targetIds.add(state.guidelineHoverId);
      state.guidelineFocusedIds.forEach(id => targetIds.add(id));
    } else if (state.guidelineMode === 'all') {
      // 永久显示全部：所有可见卡片 + Shift 叠加的临时项
      const collectAll = (list) => {
        for (const a of list) {
          if (a.status !== 'orphaned') targetIds.add(a.id);
          if (a.children && a.children.length) collectAll(a.children);
        }
      };
      collectAll(state.annotations);
    }

    // 清空旧 path
    this._svg.innerHTML = '';

    // 逐个绘制
    for (const id of targetIds) {
      const pathEl = this._buildPathForAnnotation(id);
      if (pathEl) this._svg.appendChild(pathEl);
    }
  },

  /* ---------- 为单个批注构建 SVG path ---------- */
  _buildPathForAnnotation(annId) {
    const ann = Annotations.findById(annId);
    if (!ann || ann.status === 'orphaned') return null;

    const cardEl = document.querySelector(`.card[data-id="${CSS.escape(annId)}"]`);
    if (!cardEl) return null;

    // 计算右端点：卡片左侧中点
    const endPoint = this._getCardAnchorPoint(cardEl);
    if (!endPoint) return null;

    // 计算左端点
    let startPoint;
    if (ann.parentId === null) {
      // 一级批注：Monaco range → 文字像素坐标
      startPoint = this._getMonacoAnchorPoint(ann.range);
    } else {
      // 子批注：mark.sub-anchor 元素位置
      startPoint = this._getSubAnchorPoint(ann);
    }

    if (!startPoint) return null;

    // 构建贝塞尔路径
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = this._buildBezierPath(startPoint, endPoint);
    path.setAttribute('d', d);

    // 智能模式下，聚焦的线加粗变色
    if (state.guidelineMode === 'smart' && state.guidelineFocusedIds.has(annId)) {
      path.classList.add('focused');
    } else if (state.guidelineMode === 'all') {
      path.classList.add('focused'); // 永久模式全部加粗
    }

    return path;
  },

  /* ---------- 一级批注：Monaco range → 屏幕像素 ---------- */
  _getMonacoAnchorPoint(range) {
    const monaco = state.monaco;
    if (!monaco) return null;

    const editorDom = monaco.getDomNode();
    const editorRect = editorDom.getBoundingClientRect();
    const layoutInfo = monaco.getLayoutInfo();
    const scrollTop = monaco.getScrollTop();
    const scrollLeft = monaco.getScrollLeft();

    // 行 y 坐标
    const topStart = monaco.getTopForLineNumber(range.startLineNumber);
    const topEnd = monaco.getTopForLineNumber(range.endLineNumber);
    const startY = editorRect.top + topStart - scrollTop;
    const endY = editorRect.top + topEnd - scrollTop;

    // 字符宽度（Canvas 测量）
    const fontSize = monaco.getOption('fontSize') || 14;
    const fontFamily = monaco.getOption('fontFamily') || 'monospace';
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = `${fontSize}px ${fontFamily}`;
    const charWidth = ctx.measureText('M').width || fontSize * 0.6;
    const lineHeight = fontSize * 1.5;

    // x 坐标（片段右侧）
    const contentLeft = layoutInfo.contentLeft || 64;
    const endX = editorRect.left + contentLeft + (range.endColumn - 1) * charWidth - scrollLeft;

    // 行中点 y
    const midY = (startY + endY) / 2 + lineHeight / 2;

    // 防御性检查
    if (isNaN(endX) || isNaN(midY)) return null;

    return { x: endX, y: midY };
  },

  /* ---------- 子批注：mark.sub-anchor → 屏幕像素 ---------- */
  _getSubAnchorPoint(childAnn) {
    const parentId = childAnn.parentId;
    const markEl = document.querySelector(`mark.sub-anchor[data-child-id="${CSS.escape(childAnn.id)}"]`);
    if (!markEl) return null;

    const rect = markEl.getBoundingClientRect();
    // mark 的**右侧中点**作为锚点
    return {
      x: rect.right,
      y: rect.top + rect.height / 2
    };
  },

  /* ---------- 卡片锚点：左侧中点 ---------- */
  _getCardAnchorPoint(cardEl) {
    const rect = cardEl.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) return null; // 折叠隐藏
    return {
      x: rect.left,
      y: rect.top + rect.height / 2
    };
  },

  /* ---------- 贝塞尔曲线路径（向上拱起 25px） ---------- */
  _buildBezierPath(start, end) {
    const dx = end.x - start.x;
    const midX = (start.x + end.x) / 2;
    const rise = 25; // 向上拱起

    // 两条控制点在起点和终点之间，y = min(start.y, end.y) - rise（向上拱）
    const cpY = Math.min(start.y, end.y) - rise;

    // 为了曲线更平滑，控制点的 x 稍微往中间偏移
    const cp1x = start.x + dx * 0.3;
    const cp2x = start.x + dx * 0.7;

    return `M ${start.x} ${start.y} C ${cp1x} ${cpY}, ${cp2x} ${cpY}, ${end.x} ${end.y}`;
  },

  /* ---------- 根据 Monaco 当前点击位置反查批注 id 列表 ---------- */
  _findAnnotationsAtClickPoint() {
    const monaco = state.monaco;
    if (!monaco) return [];
    const sel = monaco.getSelection();
    if (!sel || sel.isEmpty()) return [];

    const model = monaco.getModel();
    const result = [];
    for (const ann of state.annotations) {
      if (ann.status === 'orphaned') continue;
      const r = ann.range;
      // 检查 selection 是否和 annotation range 有交集
      const overlaps = !(
        sel.endLineNumber < r.startLineNumber ||
        sel.startLineNumber > r.endLineNumber ||
        (sel.startLineNumber === sel.endLineNumber &&
         sel.startColumn === sel.endColumn &&
         (sel.startColumn <= r.startColumn || sel.startColumn >= r.endColumn))
      );
      if (overlaps) result.push(ann.id);
    }
    return result;
  },
};

document.getElementById('file-input').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.docContent) {
        // 先恢复文档内容
        state.monaco.setValue(data.docContent);
      }
      const imported = data.annotations || [];
      Modal.showImportChoices(
        () => {
          // 合并：保留现有批注 + 导入的批注
          state.annotations = [...state.annotations, ...imported];
          // 给导入的生成全新的 UUID（避免冲突）
          const remap = {};
          const walkReId = (list) => list.map(a => {
            const oldId = a.id;
            remap[oldId] = Annotations.newId();
            a.id = remap[oldId];
            if (a.parentId !== null) a.parentId = remap[a.parentId] || a.parentId;
            a.children = walkReId(a.children);
            return a;
          });
          walkReId(state.annotations);
          AfterImport();
        },
        () => {
          // 覆盖
          state.annotations = imported;
          AfterImport();
        }
      );
      function AfterImport() {
        // R7: 旧数据补 tag 字段
        Storage._normalizeTags(state.annotations);
        Annotations.refreshTopLevelStatus();
        Highlight.refreshAll();
        RightPanel.render();
        Storage.saveCurrent();
      }
    } catch (err) {
      alert('导入失败：JSON 格式错误 —— ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // 允许再次选同一个文件
};

document.addEventListener('keydown', (e) => {
  // Ctrl/⌘ + S
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    Storage.saveCurrent();
  }
  // Ctrl/⌘ + Shift + E
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    UI.exportJson();
  }
  // Ctrl/⌘ + Shift + I
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    UI.triggerImport();
  }
  // Esc
  if (e.key === 'Escape') {
    CtxMenu.hide();
    // 关闭模态
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
    // 清空搜索
    if (state.searchKeyword || state.tagFilter) {
      state.searchKeyword = '';
      state.tagFilter = '';
      document.getElementById('search-input').value = '';
      document.getElementById('tag-filter').value = '';
      RightPanel.render();
    }
  }
});

/* ==================== Layer 6.3: GitHub Sync 模块 ==================== */
const GH_CONFIG_KEY = 'doc-branch-github-config';
const GH_API_BASE = 'https://api.github.com';

/* ======== base64 编码（兼容 UTF-8） ======== */
function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

/* ======== 配置管理 ======== */
const GHConfig = {
  get() {
    try {
      const raw = localStorage.getItem(GH_CONFIG_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  },
  save(cfg) {
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
  },
  clear() {
    localStorage.removeItem(GH_CONFIG_KEY);
  },
};

/* ======== GitHub API 调用层 ======== */
const GitHubAPI = {
  /* 通用 fetch（带认证头） */
  async _fetch(path, opts = {}, token) {
    const t = token || GHConfig.get()?.token;
    const headers = {
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };
    if (t) headers['Authorization'] = `Bearer ${t}`;
    if (opts.body) headers['Content-Type'] = 'application/json';

    const res = await fetch(GH_API_BASE + path, {
      ...opts,
      headers: { ...headers, ...opts.headers },
    });

    // 解析响应
    let body = null;
    try { body = await res.json(); } catch {}

    if (!res.ok) {
      const err = new Error(body?.message || `HTTP ${res.status}`);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  },

  /* R1: 测试连接 —— GET /repos/{owner}/{repo} */
  async testConnection(owner, repo, token) {
    return this._fetch(`/repos/${owner}/${repo}`, { method: 'GET' }, token);
  },

  /* 获取文件内容 + SHA —— GET /repos/{owner}/{repo}/contents/{path}?ref=branch
     注意：Contents API 路径里的 / 不需要编码，直接拼接 */
  async getContents(owner, repo, path, branch, token) {
    try {
      const body = await this._fetch(
        `/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`,
        { method: 'GET' },
        token
      );
      if (body && body.content && body.encoding === 'base64') {
        body._decoded = fromBase64(body.content);
      }
      return body;
    } catch (err) {
      if (err.status === 404) return null; // 文件不存在
      throw err;
    }
  },

  /* PUT 文件内容 —— PUT /repos/{owner}/{repo}/contents/{path}
     注意：Contents API 路径里的 / 不需要编码 */
  async putContents(owner, repo, path, content, message, branch, sha, token) {
    const body = {
      message,
      content: toBase64(content),
      branch,
    };
    if (sha) body.sha = sha;
    return this._fetch(
      `/repos/${owner}/${repo}/contents/${path}`,
      { method: 'PUT', body: JSON.stringify(body) },
      token
    );
  },
};

/* ======== GitHub Sync 主模块 ======== */
const GitHubSync = {
  /* 从文件 docPath 推导出 annotations 路径：
     docs/rules.md → annotations/rules.md.annotations.json
     未命名.md → annotations/未命名.md.annotations.json
  */
  _annotationPath(docPath) {
    const name = docPath.split('/').pop(); // 取文件名部分
    return `annotations/${name}.annotations.json`;
  },

  /* 构造 commit message */
  _buildCommitMsg(n) {
    const now = new Date();
    const pad = (v) => String(v).padStart(2, '0');
    const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    return `docbranch: 同步 ${n} 个文件批注 ${ts}`;
  },

  /* ====== 设置弹窗 ====== */
  openSettings() {

    const overlay = document.createElement('div');

    overlay.innerHTML = `
      <div class="modal modal-lg">

          <label>GitHub Personal Access Token</label>

          <div class="field-hint">只需 <code>repo</code> scope。<a href="https://github.com/settings/tokens" target="_blank" style="color:#0969da">生成新 Token →</a>（⚠️ 不要在公共电脑保存）</div>

          <label>仓库全名（owner/repo）</label>
          <input type="text" id="gh-repo" placeholder="octocat/Hello-World" value="${cfg.repo || ''}" />

          <label>分支名</label>

          <div class="test-row">

    overlay.querySelector('#gh-test-connection').onclick = async () => {

        result.className = 'test-result error';

      result.textContent = '连接中...';
      try {
        const repoInfo = await GitHubAPI.testConnection(repo.split('/')[0], repo.split('/')[1], token);

    overlay.querySelector('#gh-save-cfg').onclick = () => {

    overlay.querySelector('#gh-clear-cfg').onclick = () => {
