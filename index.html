<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>文档递归批注工具</title>
<style>
/* ========== 白色主题 ========== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { background: #ffffff; color: #24292f; display: flex; flex-direction: column; }

/* ========== 顶部工具栏 ========== */
#toolbar {
  height: 44px; background: #f6f8fa; border-bottom: 1px solid #d0d7de;
  display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
}
#toolbar .brand { font-weight: 600; color: #0969da; font-size: 14px; }
#toolbar .sep { width: 1px; height: 20px; background: #d0d7de; }
#toolbar button {
  background: #f6f8fa; border: 1px solid #d0d7de; color: #24292f; padding: 6px 12px;
  border-radius: 4px; cursor: pointer; font-size: 12px; transition: all .15s;
}
#toolbar button:hover { background: #eaeef2; }
#toolbar button.active { background: #0969da; color: #fff; border-color: #0969da; }
#toolbar .status { margin-left: auto; font-size: 11px; color: #57606a; }

/* ========== 主区域 ========== */
#main { display: flex; flex: 1; min-height: 0; --left-ratio: 60; }
#left { flex: var(--left-ratio) 1 0%; display: flex; flex-direction: column; min-width: 0; }
#splitter {
  flex: 0 0 6px; cursor: col-resize; background: #fff; position: relative; z-index: 5;
  transition: background .15s ease;
}
#splitter::after {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
  transform: translateX(-50%); background: #d0d7de;
}
#splitter:hover::after { width: 2px; background: #0969da; }
#right { flex: calc(100 - var(--left-ratio)) 1 0%; background: #f6f8fa; display: flex; flex-direction: column; min-width: 0; }

/* ========== Monaco 编辑器容器 ========== */
#monaco-container { flex: 1; min-height: 0; }

/* ========== 右栏工具条 ========== */
#right-toolbar {
  padding: 10px 14px; border-bottom: 1px solid #d0d7de; display: flex; flex-wrap: wrap;
  gap: 8px; align-items: center; flex-shrink: 0; background: #f6f8fa;
}
#right-toolbar input[type="text"] {
  flex: 1; min-width: 120px; background: #fff; border: 1px solid #d0d7de;
  color: #24292f; padding: 6px 10px; border-radius: 4px; font-size: 12px; outline: none;
}
#right-toolbar input[type="text"]:focus { border-color: #0969da; }
#right-toolbar .stats { font-size: 11px; color: #57606a; white-space: nowrap; }

/* ========== 批注卡片列表 ========== */
#annotation-list { flex: 1; overflow-y: auto; padding: 12px 10px; background: #f6f8fa; }
#annotation-list:empty::before {
  content: '暂无批注，选中文字右键添加吧 ✍️';
  color: #57606a; font-size: 13px; display: block; text-align: center; padding: 40px 0;
}

/* ========== 批注卡片 ========== */
.card {
  background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
  margin-bottom: 10px; padding: 12px 14px; position: relative;
  transition: box-shadow .15s;
}
.card:hover { box-shadow: 0 2px 12px rgba(9,105,218,0.1); }
.card.active { box-shadow: 0 0 0 2px #0969da; }
.card.orphaned { opacity: 0.5; }
.card.stale .source-text { background: rgba(188,127,48,0.15); }

.card .orphaned-tag {
  display: inline-block; background: #bf8700; color: #fff; font-size: 10px;
  padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; font-weight: 600;
}
.card .stale-tag {
  display: inline-block; background: #bf8700; color: #fff; font-size: 10px;
  padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; font-weight: 600;
}

/* ========== 标签 chip（R4/R10） ========== */
.card .tag-chip {
  display: inline-block; color: #fff; font-size: 10px;
  padding: 2px 8px; border-radius: 10px; margin-bottom: 6px;
  font-weight: 600; cursor: pointer; user-select: none;
  transition: filter .15s;
}
.card .tag-chip:hover { filter: brightness(0.9); }
.card.tag-definition { border-left: 3px solid #0969da; }
.card.tag-formula    { border-left: 3px solid #8250df; }
.card.tag-rule       { border-left: 3px solid #1a7f37; }
.card.tag-todo       { border-left: 3px solid #bf8700; }

/* 标签修改下拉菜单（R5） */
.tag-menu {
  position: fixed; z-index: 10000;
  background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 4px 0;
  min-width: 120px; font-size: 12px;
}
.tag-menu .tag-menu-item {
  padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.tag-menu .tag-menu-item:hover { background: #f6f8fa; }
.tag-menu .tag-menu-item .dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.tag-menu .tag-menu-item.active::after { content: ' ✓'; color: #0969da; margin-left: auto; }
.tag-menu .tag-menu-item.clear { color: #cf222e; border-top: 1px solid #d0d7de; margin-top: 4px; padding-top: 8px; }

/* 右栏标签筛选下拉（R8） */
#tag-filter {
  background: #fff; border: 1px solid #d0d7de; color: #24292f;
  padding: 5px 8px; border-radius: 4px; font-size: 12px; outline: none;
  cursor: pointer;
}
#tag-filter:focus { border-color: #0969da; }

.card .source-text {
  background: rgba(9,105,218,0.12); border-radius: 4px; padding: 4px 8px;
  font-size: 12px; color: #0969da; margin-bottom: 8px; word-break: break-all;
  cursor: pointer; user-select: none;
}
.card .source-text:hover { background: rgba(9,105,218,0.22); }

/* ========== SVG 虚线指引连线层 ========== */
#guideline-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9999;
}
#guideline-layer path {
  stroke: #ff6b6b; stroke-width: 2; fill: none;
  stroke-dasharray: 6 4; stroke-linecap: round;
}
#guideline-layer .guideline-line.focused { stroke: #d97706; }
#guideline-layer.hidden { display: none; }

/* ========== 子批注高亮 mark 样式 ========== */
mark.sub-anchor {
  background: rgba(9,105,218,0.18); border-bottom: 2px solid #0969da;
  cursor: pointer; border-radius: 2px; padding: 0 1px;
}
mark.sub-anchor:hover { background: rgba(9,105,218,0.32); }

/* ========== 卡片 hover 激活态（虚线指引智能模式） ========== */
.card.guideline-hover { box-shadow: 0 0 0 2px #ff6b6b; }
.card.guideline-focused { box-shadow: 0 0 0 2px #d97706; }

.card .note-content {
  font-size: 13px; line-height: 1.6; color: #24292f;
}
.card .note-content p { margin: 0 0 6px 0; }
.card .note-content p:last-child { margin-bottom: 0; }
.card .note-content code {
  background: rgba(175,184,193,0.2); padding: 1px 5px; border-radius: 3px; font-family: "Fira Code", Consolas, monospace;
  font-size: 12px; color: #1a7f37;
}
.card .note-content pre {
  background: #f6f8fa; padding: 10px; border-radius: 5px; overflow-x: auto; margin: 6px 0; border: 1px solid #d0d7de;
}
.card .note-content pre code { background: none; padding: 0; color: #24292f; }
.card .note-content blockquote {
  border-left: 3px solid #d0d7de; padding-left: 10px; color: #57606a; margin: 6px 0;
}
.card .note-content ul, .card .note-content ol { padding-left: 18px; margin: 4px 0; }

.card .note-content mark.sub-anchor {
  background: rgba(9,105,218,0.2); color: #0969da; border-radius: 2px; cursor: pointer;
  border-bottom: 1px dashed #0969da;
}
.card .note-content mark.sub-anchor:hover { background: rgba(9,105,218,0.35); }

/* ========== 卡片编辑态（feature-card-edit R1） ========== */
.card .note-content[contenteditable="true"],
.card .note-editor {
  font-size: 13px; line-height: 1.6; color: #24292f;
}
.card .note-editor {
  width: 100%; min-height: 80px; resize: vertical;
  border: 1px solid #0969da; border-radius: 6px; padding: 8px 10px;
  font-family: "Fira Code", Consolas, "Microsoft YaHei", monospace;
  font-size: 12px; color: #24292f; background: #fff;
  outline: none; transition: border-color .15s, box-shadow .15s;
  box-shadow: 0 0 0 2px rgba(9,105,218,0.15);
}
.card .note-editor:focus { border-color: #0969da; }
.card .edit-hint {
  font-size: 11px; color: #57606a; margin-top: 6px; text-align: right;
  font-style: italic;
}
.card .note-content.stale-child-hint {
  color: #bf8700; background: rgba(188,127,48,0.1);
  padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 11px;
}

.card .actions {
  position: absolute; top: 10px; right: 12px; display: flex; gap: 4px;
}
.card .actions button {
  background: transparent; border: none; color: #57606a; cursor: pointer;
  font-size: 14px; padding: 2px 4px; border-radius: 3px; transition: all .15s;
}
.card .actions button:hover { color: #0969da; background: #eaeef2; }
.card .actions .delete:hover { color: #cf222e; }
.card .actions .locate:hover { color: #1a7f37; }

.card .stale-fix {
  font-size: 11px; color: #bf8700; margin-top: 6px; cursor: pointer;
  display: inline-block; padding: 2px 6px; border-radius: 3px; background: rgba(188,127,48,0.1);
}
.card .stale-fix:hover { background: rgba(188,127,48,0.2); }

/* ========== 子批注缩进 ========== */
.children {
  padding-left: 16px; border-left: 2px solid #0969da; margin-left: 8px;
  overflow: hidden; transition: max-height 0.25s ease;
}
.children.collapsed { max-height: 0 !important; padding-top: 0; padding-bottom: 0; border-left-color: transparent; }

/* 折叠 toggle 按钮 —— 挂在 card 上 */
.card .collapse-toggle {
  position: absolute; top: 10px; right: 36px; background: transparent;
  border: none; cursor: pointer; font-size: 14px; color: #57606a;
  padding: 2px 4px; border-radius: 3px; transition: all .15s;
  display: none;
}
.card.has-children .collapse-toggle { display: inline-block; }
.card .collapse-toggle:hover { color: #0969da; background: #eaeef2; }

/* ========== 多文件切换器 ========== */
.file-switcher { display: flex; gap: 4px; align-items: center; }
.file-switcher select {
  background: #fff; border: 1px solid #d0d7de; border-radius: 4px;
  padding: 5px 8px; font-size: 12px; color: #24292f; cursor: pointer;
  min-width: 140px; max-width: 200px; outline: none;
}
.file-switcher select:focus { border-color: #0969da; }
.file-switcher button {
  background: #f6f8fa; border: 1px solid #d0d7de; color: #24292f;
  width: 26px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.file-switcher button:hover { background: #0969da; color: #fff; border-color: #0969da; }

/* ========== 弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: #fff; border: 1px solid #d0d7de; border-radius: 10px;
  padding: 20px; width: 480px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.modal h3 { color: #0969da; font-size: 15px; margin-bottom: 12px; }
.modal .selected-preview {
  background: rgba(9,105,218,0.12); border-radius: 4px; padding: 6px 10px;
  font-size: 12px; color: #0969da; margin-bottom: 12px; word-break: break-all;
}
.modal textarea {
  width: 100%; min-height: 120px; background: #fff; border: 1px solid #d0d7de;
  color: #24292f; padding: 10px; border-radius: 6px; font-size: 13px;
  font-family: inherit; resize: vertical; outline: none;
}
.modal textarea:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9,105,218,0.2); }
.modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.modal .modal-actions button {
  padding: 7px 16px; border-radius: 5px; border: 1px solid #d0d7de; cursor: pointer; font-size: 13px;
  background: #f6f8fa; color: #24292f;
}
.modal .btn-primary { background: #0969da; color: #fff; border-color: #0969da; }
.modal .btn-primary:hover { background: #0860c1; }
.modal .btn-secondary:hover { background: #eaeef2; }
.modal .btn-danger { background: #cf222e; color: #fff; border-color: #cf222e; }
.modal .btn-danger:hover { background: #b81d27; }

/* ========== 自定义右键菜单 ========== */
.custom-context-menu {
  position: fixed; background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
  padding: 4px; z-index: 2000; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  min-width: 160px;
}
.custom-context-menu .menu-item {
  padding: 7px 14px; font-size: 13px; color: #24292f; cursor: pointer;
  border-radius: 4px; transition: all .1s;
}
.custom-context-menu .menu-item:hover { background: #0969da; color: #fff; }

/* ========== Monaco 覆盖样式 ========== */
.monaco-editor { background: #fff !important; }
.monaco-editor .my-annotation {
  background: rgba(9,105,218,0.18); border-bottom: 2px solid #0969da;
  border-radius: 2px;
}
.monaco-editor .my-annotation-stale {
  background: rgba(188,127,48,0.18); border-bottom: 2px solid #bf8700;
  border-radius: 2px;
}
.monaco-editor .my-annotation-orphaned {
  /* 不显示高亮 */
}

/* ========== GitHub Sync 弹窗增强 ========== */
.gh-config-form label {
  display: block;
  font-size: 12px;
  color: #57606a;
  margin-bottom: 4px;
  font-weight: 500;
}
.gh-config-form input[type="text"],
.gh-config-form input[type="password"] {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #d0d7de;
  border-radius: 5px;
  font-size: 13px;
  margin-bottom: 12px;
  outline: none;
  background: #fff;
  color: #24292f;
  font-family: inherit;
}
.gh-config-form input:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9,105,218,0.15); }
.gh-config-form .field-hint {
  font-size: 11px;
  color: #57606a;
  margin: -8px 0 10px 0;
  line-height: 1.4;
}
.gh-config-form .test-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 4px;
  margin-bottom: 12px;
}
.gh-config-form .test-result {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 4px;
  display: none;
}
.gh-config-form .test-result.success { display: inline-block; background: rgba(26,127,55,0.12); color: #1a7f37; }
.gh-config-form .test-result.error { display: inline-block; background: rgba(207,34,46,0.12); color: #cf222e; }

/* 提交进度弹窗 */
.gh-progress { font-size: 13px; }
.gh-progress .file-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-size: 12px;
  font-family: "Fira Code", Consolas, monospace;
}
.gh-progress .file-line.status-ok { background: rgba(26,127,55,0.08); color: #1a7f37; }
.gh-progress .file-line.status-fail { background: rgba(207,34,46,0.08); color: #cf222e; }
.gh-progress .file-line.status-wait { color: #57606a; }
.gh-progress .file-line .status-icon { width: 16px; text-align: center; }
.gh-progress .commit-link {
  margin-top: 12px;
  padding: 10px 14px;
  background: rgba(9,105,218,0.1);
  border-radius: 5px;
  font-size: 12px;
}
.gh-progress .commit-link a { color: #0969da; text-decoration: none; font-weight: 500; }
.gh-progress .commit-link a:hover { text-decoration: underline; }
.gh-progress .final-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}

/* 冲突处理弹窗 */
.gh-conflict { font-size: 13px; line-height: 1.6; }
.gh-conflict .conflict-file-list {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 4px;
  padding: 8px 12px;
  margin: 10px 0;
  max-height: 120px;
  overflow-y: auto;
  font-family: "Fira Code", Consolas, monospace;
  font-size: 12px;
}
.gh-conflict .radio-group { margin-top: 10px; }
.gh-conflict .radio-group label {
  display: block;
  padding: 6px 0;
  cursor: pointer;
  font-size: 13px;
  color: #24292f;
}
.gh-conflict .radio-group label:hover { color: #0969da; }
.gh-conflict .radio-group input[type="radio"] { margin-right: 8px; }

/* 大弹窗（提交设置/进度） */
.modal-lg { width: 580px; }

/* 加载中按钮禁用状态 */
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ========== 目录树侧边栏 ========== */
#btn-toggle-sidebar {
  background: transparent; border: none; color: #24292f;
  font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 4px;
  transition: all .15s;
}
#btn-toggle-sidebar:hover { background: #eaeef2; color: #0969da; }
#btn-toggle-sidebar.active { background: #0969da; color: #fff; }

#sidebar {
  width: 220px;
  background: #f6f8fa;
  border-right: 1px solid #d0d7de;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width .25s ease, opacity .25s ease;
}
#sidebar.sidebar-hidden {
  width: 0;
  opacity: 0;
  border-right: none;
}
#sidebar.sidebar-hidden > * { display: none; }

.sidebar-header {
  padding: 10px 14px;
  border-bottom: 1px solid #d0d7de;
  flex-shrink: 0;
  background: #f6f8fa;
}
.sidebar-title { font-size: 12px; font-weight: 600; color: #24292f; }
.sidebar-hint { display: none; } /* R15: 展开时的 hint 先隐藏，纯图标 */

.directory-tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  font-size: 13px;
}
.directory-tree:empty::before {
  content: '暂无文件';
  display: block;
  text-align: center;
  color: #57606a;
  font-size: 12px;
  padding: 20px 0;
}

/* 目录节点 */
.tree-folder {
  cursor: pointer;
  user-select: none;
}
.tree-folder-header {
  padding: 5px 10px 5px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #24292f;
  font-weight: 500;
  transition: background .1s;
}
.tree-folder-header:hover { background: rgba(9,105,218,0.08); }
.tree-folder-header .folder-icon {
  font-size: 12px; width: 12px; text-align: center; color: #57606a;
}
.tree-folder-header .folder-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-folder-header .folder-count {
  font-size: 10px; color: #57606a; background: rgba(0,0,0,0.06);
  padding: 1px 6px; border-radius: 10px; font-weight: 400;
}
.tree-folder-children { padding-left: 16px; }

/* 文件节点 */
.tree-file {
  padding: 4px 10px 4px 28px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: #24292f;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background .1s;
  position: relative;
}
.tree-file:hover { background: rgba(9,105,218,0.08); }
.tree-file.file-active {
  background: rgba(9,105,218,0.12);
  color: #0969da;
  font-weight: 600;
}
.tree-file.file-active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: #0969da;
  border-radius: 0 2px 2px 0;
}
.tree-file .file-icon { font-size: 12px; flex-shrink: 0; }
.tree-file .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-file .file-path {
  font-size: 10px; color: #8c959f; margin-left: auto;
  font-family: "Fira Code", Consolas, monospace;
}

/* 根目录文件（无父目录）—— 左缩进为 10px（和目录 header 对齐） */
.tree-file.tree-root-file { padding-left: 14px; }

/* ========== 移动端 Markdown 渲染区（桌面端隐藏） ========== */
#mobile-markdown {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  background: #ffffff;
  line-height: 1.75;
  font-size: 15px;
  color: #24292f;
}
#mobile-markdown h1, #mobile-markdown h2, #mobile-markdown h3 {
  margin: 1.2em 0 0.6em; font-weight: 600; line-height: 1.3;
}
#mobile-markdown h1 { font-size: 1.6em; border-bottom: 1px solid #d0d7de; padding-bottom: 0.3em; }
#mobile-markdown h2 { font-size: 1.35em; border-bottom: 1px solid #eaeef2; padding-bottom: 0.25em; }
#mobile-markdown h3 { font-size: 1.15em; }
#mobile-markdown p { margin: 0.8em 0; }
#mobile-markdown ul, #mobile-markdown ol { padding-left: 1.8em; margin: 0.6em 0; }
#mobile-markdown li { margin: 0.3em 0; }
#mobile-markdown blockquote {
  border-left: 3px solid #d0d7de; padding: 0.2em 0.8em;

<!-- 极简 console redirector（鸿蒙/安卓调试用，零外部依赖） -->
<script>
(function(){
  // 只在小屏启用
  if (window.innerWidth > 768) return;
  var logs = [];
  function wrap(type) {
    var orig = console[type];
    console[type] = function() {
      var args = Array.prototype.slice.call(arguments);
      logs.push({ type: type, msg: args.map(function(a){ return typeof a==='object' ? JSON.stringify(a).slice(0,200) : String(a); }).join(' ') });
      try { orig.apply(console, arguments); } catch(e) {}
      render();
    };
  }
  wrap('log'); wrap('warn'); wrap('error'); wrap('info');

  var panel, toggle;
  function render() {
    if (!panel) return;
    var html = logs.slice(-30).map(function(l){
      var color = l.type==='error' ? '#cf222e' : l.type==='warn' ? '#9a6700' : '#24292f';
      return '<div style="color:'+color+';font-size:11px;padding:2px 6px;border-bottom:1px solid #eaeef2;word-break:break-all;">'+l.msg+'</div>';
    }).join('');
    panel.innerHTML = html || '<div style="color:#8c959f;padding:8px;">(暂无日志)</div>';
    panel.scrollTop = panel.scrollHeight;
  }

  // 等 DOM ready
  document.addEventListener('DOMContentLoaded', function(){
    // 悬浮按钮
    toggle = document.createElement('div');
    toggle.textContent = '🐛';
    toggle.style.cssText = 'position:fixed;bottom:80px;left:12px;width:36px;height:36px;background:#24292f;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10000;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;';
    toggle.onclick = function(){
      if (!panel) {
        panel = document.createElement('div');
        panel.style.cssText = 'position:fixed;bottom:120px;left:12px;right:12px;height:200px;background:rgba(255,255,255,0.98);border:1px solid #d0d7de;border-radius:8px;z-index:10000;overflow-y:auto;font-family:monospace;box-shadow:0 4px 16px rgba(0,0,0,0.2);';
        document.body.appendChild(panel);
        render();
      }
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
    };
    document.body.appendChild(toggle);
  });
})();
</script>

<!-- SVG 虚线指引连线层（指针事件穿透；必须在主 <script> 之前，保证 Guideline.init() 能获取到） -->
<svg id="guideline-layer" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
/* ================================================================
 *  文档递归批注工具 —— 主脚本
 *  分层结构：
 *    Layer 0 — 常量与依赖声明
 *    Layer 1 — 数据存储层（localStorage CRUD、防抖）
 *    Layer 2 — 批注数据模型（树形 CRUD、UUID、状态检测）
 *    Layer 3 — Monaco Editor 初始化 + 高亮装饰管理
 *    Layer 4 — 弹窗与右键菜单
 *    Layer 5 — 右栏卡片树形渲染 + 子批注交互
 *    Layer 6 — 搜索过滤、全局开关、导入导出、快捷键
 *    Layer 7 — 启动恢复流程
 * ================================================================ */

/* ==================== Layer 0: 常量 ==================== */
const INDEX_KEY = 'doc-branch-index-v1';           // 文件索引 key
const FILE_KEY_PREFIX = 'doc-branch-files/';       // 每个文件的 key 前缀
const DATA_VERSION = 2;                             // 数据格式版本（从 1 升到 2，支持多文件）
const GUIDELINE_MODE_KEY = 'doc-branch-guideline-mode-v1'; // 虚线指引三态：smart / all / off
const SPLIT_RATIO_KEY = 'doc-branch-split-ratio-v1';       // 分割线位置（左栏百分比 30~80）

/* 预设标签类型（R1） */
const TAG_OPTIONS = [
  { key: 'definition', label: '定义', color: '#0969da' },
  { key: 'formula',    label: '公式', color: '#8250df' },
  { key: 'rule',       label: '规则', color: '#1a7f37' },
  { key: 'todo',       label: '待确认', color: '#bf8700' },
];
const TAG_MAP = Object.fromEntries(TAG_OPTIONS.map(t => [t.key, t]));
const DEFAULT_DOC = `# 示例文档: 号码筛选规则

不选任何条件 | 该维度不过滤, 全部 80 个号码通过.

## 规则说明

筛选规则共包含 8 个维度, 每个维度可独立配置过滤条件.

> 💡 选中任意文字右键添加批注, 批注内的词语可继续递归批注.
`;

/* 生成 UUID v4（内联实现） */
function uuidv4() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* 极简 Markdown 渲染器（支持 **加粗**、`代码`、> 引用、- 列表、1. 有序列表、换行） */
function simpleMarkdown(md) {
  if (!md) return '';
  let lines = md.split('\n');
  let html = '';
  let inUl = false, inOl = false, inCode = false, codeBuf = '';

  const closeLists = () => {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
  };

  for (const line of lines) {
    // 代码块
    if (line.trim().startsWith('```')) {
      if (!inCode) { closeLists(); inCode = true; codeBuf = ''; }
      else { inCode = false; html += `<pre><code>${escapeHtml(codeBuf)}</code></pre>`; }
      continue;
    }
    if (inCode) { codeBuf += line + '\n'; continue; }

    // 引用
    if (line.trim().startsWith('>')) {
      closeLists();
      const text = line.trim().replace(/^>\s*/, '');
      html += `<blockquote>${inlineMd(text)}</blockquote>`;
      continue;
    }

    // 无序列表
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inUl) { closeLists(); html += '<ul>'; inUl = true; }
      html += `<li>${inlineMd(line.replace(/^\s*[-*]\s+/, ''))}</li>`;
      continue;
    }
    // 有序列表
    if (/^\s*\d+\.\s+/.test(line)) {
      if (!inOl) { closeLists(); html += '<ol>'; inOl = true; }
      html += `<li>${inlineMd(line.replace(/^\s*\d+\.\s+/, ''))}</li>`;
      continue;
    }

    // 空行
    if (line.trim() === '') {
      closeLists();
      html += '<p></p>';
      continue;
    }

    // 普通段落
    closeLists();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeLists();
  if (inCode) html += `<pre><code>${escapeHtml(codeBuf)}</code></pre>`;
  return html;
}

/* Markdown 行内语法（**加粗**、`代码`） */
function inlineMd(text) {
  // 转义 HTML 先
  let s = escapeHtml(text);
  // **bold**
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // *italic*
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // `code`
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

/* HTML 转义（安全渲染） */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* 全局状态 */
const state = {
  monaco: null,              // Monaco Editor 实例
  docContent: '',            // 文档内容缓存（移动端无 Monaco 时使用）
  annotations: [],           // 当前文件的批注树
  decorations: [],           // Monaco 装饰器 ids
  showHighlight: true,       // 全局高亮开关
  readOnly: false,            // 只读模式
  searchKeyword: '',          // 搜索关键词
  tagFilter: '',              // 标签筛选（空=全部，不持久化 R9）
  collapsedIds: new Set(),   // 被折叠的批注 id 集合

  /* ====== 虚线指引连线 ====== */
  guidelineMode: 'smart',    // 'smart' | 'all' | 'off'
  guidelineFocusedIds: new Set(), // 智能模式下被聚焦的批注 id（点击保持的）
  guidelineHoverId: null,    // 当前 hover 的批注 id（鼠标悬停）

  /* ====== 多文件新增 ====== */
  currentFileId: null,       // 当前激活的文件 id
  files: [],                 // 文件索引数组 [{id, name, docPath}]
  switchingFile: false,      // 文件切换中标志（debounceSave 检查此标志跳过）
  splitRatio: 60,            // 分割线位置（左栏百分比 30~80）
};

/* ==================== Layer 1: 数据存储层（多文件两层架构） ==================== */
const Storage = {
  /* ---- 索引层 ---- */
  saveIndex() {
    const idx = {
      version: DATA_VERSION,
      currentFileId: state.currentFileId,
      files: state.files.map(f => ({ id: f.id, name: f.name, docPath: f.docPath })),
    };
    localStorage.setItem(INDEX_KEY, JSON.stringify(idx));
  },

  loadIndex() {
    try {
      const raw = localStorage.getItem(INDEX_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== DATA_VERSION) return null;
      return data;
    } catch (e) {
      console.error('读取索引失败:', e);
      return null;
    }
  },

  /* ---- 文件数据层（每个文件独立 key） ---- */
  _fileKey(id) { return FILE_KEY_PREFIX + id; },

  saveCurrent() {
    if (!state.currentFileId) return;
    // 移动端没有 Monaco，用 state.docContent 缓存值
    const docContent = state.monaco ? state.monaco.getValue() : (state.docContent || '');
    const data = {
      version: DATA_VERSION,
      docContent,
      annotations: state.annotations,
      collapsedIds: Array.from(state.collapsedIds),
    };
    try {
      localStorage.setItem(this._fileKey(state.currentFileId), JSON.stringify(data));
      this.saveIndex(); // 索引也要保存（currentFileId 可能变了）
      UI.setSaveStatus('已保存 ✓');
    } catch (e) {
      console.error('保存失败:', e);
      UI.setSaveStatus('保存失败 ✗');
    }
  },

  debounceSave() {
    if (state.switchingFile) return; // 切换文件期间跳过
    UI.setSaveStatus('保存中...');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.saveCurrent(), 500);
  },

  loadFile(id) {
    try {
      const raw = localStorage.getItem(this._fileKey(id));
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== DATA_VERSION) return null;
      // R7: 旧数据补 tag 字段
      if (Array.isArray(data.annotations)) this._normalizeTags(data.annotations);
      return data;
    } catch (e) {
      console.error('读取文件数据失败:', e);
      return null;
    }
  },

  /* R7: 递归为所有批注节点补 tag: null（兼容旧数据） */
  _normalizeTags(list) {
    for (const a of list) {
      if (typeof a.tag !== 'string') a.tag = null;
      if (Array.isArray(a.children)) this._normalizeTags(a.children);
    }
  },

  /* ---- 文件 CRUD ---- */
  createFile(name, docPath) {
    const id = uuidv4();
    const file = { id, name, docPath };
    state.files.push(file);
    // 立即写入空文件数据（用 DEFAULT_DOC 模板）
    const emptyData = {
      version: DATA_VERSION,
      docContent: DEFAULT_DOC,
      annotations: [],
      collapsedIds: [],
    };
    localStorage.setItem(this._fileKey(id), JSON.stringify(emptyData));
    this.saveIndex();
    return file;
  },

  deleteFile(id) {
    localStorage.removeItem(this._fileKey(id));
    state.files = state.files.filter(f => f.id !== id);
    this.saveIndex();
  },

  renameFile(id, name, docPath) {
    const f = state.files.find(f => f.id === id);
    if (f) { f.name = name; f.docPath = docPath; this.saveIndex(); }
  },

  switchToFile(id) {
    // 1. 先保存当前文件
    if (state.currentFileId) this.saveCurrent();
    // 2. 标记切换中（防止 debounceSave 干扰）
    state.switchingFile = true;
    state.currentFileId = id;
    // 3. 加载目标文件数据
    const data = this.loadFile(id);
    const docContent = data ? data.docContent : DEFAULT_DOC;
    state.docContent = docContent;
    state.annotations = data ? data.annotations : [];
    state.collapsedIds = new Set(data && Array.isArray(data.collapsedIds) ? data.collapsedIds : []);
    // 4. 同步到 Monaco（桌面端有）
    if (state.monaco) state.monaco.setValue(docContent);
    // 5. 刷新 UI
    if (state.monaco) {
      Annotations.refreshTopLevelStatus();
      Highlight.refreshAll();
      RightPanel.render();
      Files.updateSwitcher();
    } else {
      // 移动端：通知 MobileReader 刷新
      document.dispatchEvent(new CustomEvent('mobile-file-switch', { detail: { id } }));
    }
    // 6. 解除切换标志（放 setTimeout 保证 didChange 事件已处理完）
    setTimeout(() => { state.switchingFile = false; }, 50);
    UI.setSaveStatus(`已切换到「${state.files.find(f=>f.id===id)?.name || '未知'}」`);
  },

  /* ---- 迁移：从 v1 单文件升级到 v2 多文件 ---- */
  migrateV1toV2() {
    const OLD_KEY = 'doc-branch-snapshot-v1';
    const oldRaw = localStorage.getItem(OLD_KEY);
    if (!oldRaw) return false;
    try {
      const oldData = JSON.parse(oldRaw);
      if (oldData.version !== 1) return false;
      // 创建一个默认文件承载旧数据
      const file = this.createFile('未命名文档', 'docs/未命名.md');
      // 把旧数据写入新 key
      const migrated = {
        version: DATA_VERSION,
        docContent: oldData.docContent || DEFAULT_DOC,
        annotations: oldData.annotations || [],
        collapsedIds: oldData.collapsedIds || [],
      };
      localStorage.setItem(this._fileKey(file.id), JSON.stringify(migrated));
      // 删掉旧 key
      localStorage.removeItem(OLD_KEY);
      console.log('✓ 已从 v1 单文件迁移到 v2 多文件架构');
      return true;
    } catch (e) {
      console.error('迁移失败:', e);
      return false;
    }
  },
};

/* ==================== Layer 2: 批注数据模型 ==================== */
const Annotations = {
  /* 生成 UUID */
  newId() { return uuidv4(); },

  /* 添加一级批注 —— tag 可选，默认 null（R6） */
  addTopLevel(range, sourceText, note, tag = null) {
    const ann = {
      id: this.newId(),
      parentId: null,
      status: 'active',
      range: { ...range },
      sourceText,
      note,
      tag,
      children: [],
    };
    state.annotations.push(ann);
    return ann;
  },

  /* 添加子批注 —— parentId: 父批注 id, offsetStart/End: 父 note 内字符偏移, tag 可选 */
  addChild(parentId, noteOffsetStart, noteOffsetEnd, sourceText, note, tag = null) {
    const parent = this.findById(parentId);
    if (!parent) return null;
    const child = {
      id: this.newId(),
      parentId,
      status: 'active',
      noteOffsetStart,
      noteOffsetEnd,
      sourceText,
      note,
      tag,
      children: [],
    };
    parent.children.push(child);
    return child;
  },

  /* 更新批注标签（R5） */
  updateTag(id, tag) {
    const ann = this.findById(id);
    if (!ann) return;
    ann.tag = (typeof tag === 'string' && TAG_MAP[tag]) ? tag : null;
  },

  /* 递归查找 */
  findById(id, list = state.annotations) {
    for (const a of list) {
      if (a.id === id) return a;
      const found = this.findById(id, a.children);
      if (found) return found;
    }
    return null;
  },

  /* 删除（级联） */
  remove(id, list = state.annotations) {
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) { list.splice(i, 1); return true; }
      if (this.remove(id, list[i].children)) return true;
    }
    return false;
  },

  /* 更新一级批注的 sourceText 为当前 Range 实际文本 */
  confirmUpdate(id) {
    const ann = this.findById(id);
    if (!ann || ann.status === 'orphaned') return;
    const range = ann.range;
    const model = state.monaco.getModel();
    const actual = model.getValueInRange(range);
    ann.sourceText = actual;
    ann.status = 'active';
  },

  /* R1-R8: 编辑批注 note 内容；如果修改的是父批注，自动重算子批注偏移 */
  editNote(id, newNote) {
    const ann = this.findById(id);
    if (!ann) return null;
    const oldNote = ann.note || '';
    ann.note = newNote;
    // R6/R7: 如果修改的是父批注（有 children），重算子批注偏移
    if (ann.children && ann.children.length > 0) {
      this.recalcChildOffsets(id, oldNote, newNote);
    }
    return ann;
  },

  /* R7: 重算指定父批注下所有子批注的 noteOffset
   * 用每个 child.sourceText 在新 note 中 indexOf 查找；找不到标记为 stale */
  recalcChildOffsets(parentId, oldNote, newNote) {
    const parent = this.findById(parentId);
    if (!parent || !parent.children || parent.children.length === 0) return;
    for (const child of parent.children) {
      const idx = newNote.indexOf(child.sourceText);
      if (idx !== -1) {
        child.noteOffsetStart = idx;
        child.noteOffsetEnd = idx + child.sourceText.length;
        child.status = 'active';
      } else {
        // 找不到：子批注标记为 stale（但子批注没有 status 渲染，只通过父卡片提示）
        child.status = 'stale';
      }
    }
  },

  /* 重新检测所有一级批注的状态 */
  refreshTopLevelStatus() {
    const model = state.monaco.getModel();
    const lineCount = model.getLineCount();
    for (const ann of state.annotations) {
      const r = ann.range;
      // orphaned: 行号越界，或 sourceText 为空字符串且位置越界
      if (r.startLineNumber > lineCount || r.endLineNumber > lineCount) {
        ann.status = 'orphaned';
        continue;
      }
      const actual = model.getValueInRange(r);
      if (!actual || actual === '') {
        ann.status = 'orphaned';
      } else if (actual !== ann.sourceText) {
        ann.status = 'stale';
      } else {
        ann.status = 'active';
      }
    }
  },

  /* 统计 */
  getStats() {
    let top = state.annotations.length;
    let sub = 0;
    let depth = 1;
    const walk = (list, d) => {
      if (d > depth) depth = d;
      for (const a of list) {
        sub += a.children.length;
        walk(a.children, d + 1);
      }
    };
    walk(state.annotations, 1);
    return { total: top + sub, top, sub, depth };
  },
};

/* ==================== Layer 3: Monaco Editor + 高亮 ==================== */
const Editor = {
  init() {
    // Monaco Worker 环境配置（CDN 加载需要显式指定）
    window.MonacoEnvironment = {
      getWorkerUrl: function(workerId, label) {
        return 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.js';
      }
    };
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(
      ['vs/editor/editor.main'],
      () => this.onReady(),
      (err) => console.error('Monaco 加载失败:', err)
    );
  },

  onReady() {
    /* ====== 多文件初始化 ====== */
    // 1. 先尝试从 v1 单文件迁移
    Storage.migrateV1toV2();

    // 2. 加载文件索引
    let idx = Storage.loadIndex();
    if (!idx || !idx.files || idx.files.length === 0) {
      // 无索引 → 首次打开，创建默认文件
      const f = Storage.createFile('未命名文档', 'docs/未命名.md');
      idx = { currentFileId: f.id, files: [f] };
    }
    state.files = idx.files;
    state.currentFileId = idx.currentFileId || idx.files[0].id;

    // 3. 加载当前文件数据
    const currentData = Storage.loadFile(state.currentFileId);
    const initialContent = currentData ? currentData.docContent : DEFAULT_DOC;
    state.docContent = initialContent; // 同步缓存
    state.annotations = currentData ? currentData.annotations : [];
    state.collapsedIds = new Set(currentData && Array.isArray(currentData.collapsedIds) ? currentData.collapsedIds : []);

    state.monaco = monaco.editor.create(document.getElementById('monaco-container'), {
      value: initialContent,
      language: 'markdown',
      theme: 'vs',
      fontFamily: '"Fira Code", Consolas, "Microsoft YaHei", monospace',
      fontSize: 14,
      minimap: { enabled: false },
      automaticLayout: true,
      wordWrap: 'on',
      scrollBeyondLastLine: false,
      unicodeHighlight: { ambiguousCharacters: false },
    });

    // 注册右键菜单
    this.registerContextMenu();

    // 内容变更监听 —— 防抖保存 + 刷新高亮 + 状态检测
    state.monaco.onDidChangeModelContent(() => {
      state.docContent = state.monaco.getValue(); // 同步缓存（避免桌面→移动端切换时内容过期）
      Annotations.refreshTopLevelStatus();
      Highlight.refreshAll();
      RightPanel.render();
      Storage.debounceSave();
    });

    // 恢复初始状态
    Annotations.refreshTopLevelStatus();
    Highlight.refreshAll();
    RightPanel.render();
    Files.updateSwitcher();

    // 状态条
    UI.setSaveStatus('已就绪');
  },

  registerContextMenu() {
    const monaco = state.monaco;
    monaco.addAction({
      id: 'add-annotation',
      label: '添加批注',
      contextMenuGroupId: 'navigation',
      contextMenuOrder: 1,
      run: () => {
        const sel = monaco.getSelection();
        if (!sel || sel.isEmpty()) return;
        const text = monaco.getModel().getValueInRange(sel);
        Modal.showAddTopLevel(sel, text);
      },
    });
  },
};

/* 高亮装饰管理 */
const Highlight = {
  /* 重新渲染所有一级批注的高亮装饰器 */
  refreshAll() {
    if (!state.monaco) return;
    const decorations = [];
    if (state.showHighlight) {
      for (const ann of state.annotations) {
        if (ann.status === 'orphaned') continue;
        const cls = ann.status === 'stale' ? 'my-annotation-stale' : 'my-annotation';
        decorations.push({
          range: ann.range,
          options: {
            className: cls,
            stickiness: monaco.editor.TrackedRangeStickiness.AlwaysGrowsWhenTypingAtEdges,
          },
        });
      }
    }
    state.decorations = state.monaco.deltaDecorations(state.decorations, decorations);
  },

  /* 滚动到指定 Range */
  scrollTo(range) {
    state.monaco.revealRangeInCenter(range);
    state.monaco.setSelection(range);
    state.monaco.focus();
  },
};

/* ==================== Layer 4: 弹窗与右键菜单 ==================== */
const Modal = {
  /* 生成标签下拉 HTML 选项 */
  _tagSelectHtml(defaultTag = 'definition') {
